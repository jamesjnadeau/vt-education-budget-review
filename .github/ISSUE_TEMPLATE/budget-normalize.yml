name: Normalize a budget document
description: >-
  Enter the figures from a budget book already in intake/. A bot validates them
  against the budget schema and opens a pull request adding the warehouse record.
title: "Budget normalize: "
labels: [budget-normalize]
body:
  - type: markdown
    attributes:
      value: >-
        For a document already landed in `intake/`. Every figure below is either a
        number **or the literal `n/p`** if the budget book does not publish it — a
        blank is rejected, because a null has to mean "not published", never "not
        looked". An `n/p` is recorded as confirmed by you on the day you submit.
  - type: input
    id: entity
    attributes:
      label: "entity"
      description: Registry slug. Prefilled from the coverage cell.
      placeholder: "su/addison-central"
    validations:
      required: true
  - type: input
    id: fiscal_year
    attributes:
      label: "fiscal_year"
      description: Four-digit fiscal year. Prefilled from the coverage cell.
      placeholder: "2023"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: "status"
      description: Where in its lifecycle this budget was when the document was published.
      options:
        - proposed
        - warned
        - approved
        - actual
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "source"
      description: Repo-relative intake path. Prefilled from the coverage cell.
      placeholder: "intake/su-addison-central/fy2023/budget.pdf"
    validations:
      required: true
  - type: input
    id: source_pages
    attributes:
      label: "source_pages"
      description: Optional page or section reference, so the record is checkable by hand.
      placeholder: "pp. 14-17"
    validations:
      required: false
  - type: input
    id: adopted_date
    attributes:
      label: "adopted_date"
      description: Optional; town-meeting or board vote date for approved/actual budgets.
      placeholder: "2023-03-07"
    validations:
      required: false
  - type: input
    id: education_spending
    attributes:
      label: "education_spending"
      description: The district's published Education Spending figure (expenditures net of offsetting revenues). Whole dollars, or n/p if the document does not publish it.
      placeholder: "number or n/p"
    validations:
      required: true
  - type: input
    id: adm_prekindergarten
    attributes:
      label: "adm.prekindergarten"
      description: District-stated prekindergarten ADM. A number (pupils, decimals allowed), or n/p.
      placeholder: "number or n/p"
    validations:
      required: true
  - type: input
    id: adm_kindergarten_through_5
    attributes:
      label: "adm.kindergarten_through_5"
      description: District-stated K-5 ADM. A number, or n/p.
      placeholder: "number or n/p"
    validations:
      required: true
  - type: input
    id: adm_grades_6_through_8
    attributes:
      label: "adm.grades_6_through_8"
      description: District-stated grades 6-8 ADM. A number, or n/p.
      placeholder: "number or n/p"
    validations:
      required: true
  - type: input
    id: adm_grades_9_through_12
    attributes:
      label: "adm.grades_9_through_12"
      description: District-stated grades 9-12 ADM. A number, or n/p.
      placeholder: "number or n/p"
    validations:
      required: true
  - type: textarea
    id: tax_towns
    attributes:
      label: "tax.towns"
      description: >-
        One member town per line as `town-slug, homestead_rate, cla` (each rate a
        number or n/p; CLA as a ratio like 0.8734). Or a single line `n/p` if the
        document publishes no per-town table.
      placeholder: "town/addison, 1.5225, 0.8734"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "notes"
      description: Optional free text — context that doesn't belong in a figure or a flagged line.
    validations:
      required: false
  - type: textarea
    id: lines_flagged
    attributes:
      label: "lines_flagged"
      description: >-
        Optional. Anything that did not fit cleanly, one per line as
        `path :: what was off` (e.g. `education_spending ::
        education spending line unreadable`).
    validations:
      required: false
