name: Source liveness

# Weekly check that every collector source URL still resolves. A district
# reorganizing its website is news worth acting on, not a broken pipeline, so
# dead links are reported on a tracker issue rather than failing a build.

on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check source URLs
        id: check
        run: |
          npm run collect -- --check-urls 2>&1 | tee "$RUNNER_TEMP/liveness.log"
          {
            echo 'report<<LIVENESS_EOF'
            grep -E '^  DEAD|^Checked' "$RUNNER_TEMP/liveness.log" || echo 'No output.'
            echo 'LIVENESS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report dead links on the standing tracker issue
        if: contains(steps.check.outputs.report, 'DEAD')
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              'The weekly liveness check could not reach one or more collector source URLs.',
              '',
              'A district reorganizing its website is the usual cause, and it usually means',
              'the budget documents moved too. Finding where they moved to is the actual task;',
              'updating the URL is the easy part.',
              '',
              '```',
              process.env.REPORT,
              '```',
            ].join('\n');

            // One standing tracker: comment on the oldest open dead-link issue.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'dead-link', state: 'open',
              sort: 'created', direction: 'asc', per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number,
                body: `**${date}**\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'Dead collector source URLs (tracker)',
                labels: ['collectors', 'dead-link'],
                body,
              });
            }
        env:
          REPORT: ${{ steps.check.outputs.report }}

      - name: Commit updated last_checked timestamps
        uses: peter-evans/create-pull-request@v7
        with:
          branch: liveness/weekly
          title: 'Collector source liveness check'
          commit-message: 'Record weekly source URL liveness results'
          labels: collectors
          body: |
            Automated weekly liveness check. Updates `last_checked` and `last_status`
            on each collector source.
