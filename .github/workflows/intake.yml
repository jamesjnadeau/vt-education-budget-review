name: Intake

# Turns a budget-intake issue into a pull request: validate the form, download
# the attached document, hash it, and open a PR adding the raw artifact and a
# generated provenance.yaml. Anything wrong is reported as a comment on the
# issue, which stays open so the `edited` trigger picks up the fix.
#
# The logic lives in tools/src/intake/ (pure, unit-tested) and
# tools/src/cli/intake.ts (the IO shell). This file stays deliberately thin.

on:
  issues:
    # `labeled` is here so applying the budget-intake label to an existing issue
    # re-runs intake -- the clean way to reprocess one after a fix ships.
    types: [opened, edited, labeled]

# Least privilege: open a PR and comment, never more. In particular no direct
# push to main -- human merge stays the gate, the same one validate.yml is.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Serialise runs for the same issue so an `edited` fired while an `opened` run
  # is still going cannot race on the branch.
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    # Recognise a budget-intake issue by the label OR the template's title
    # prefix. The title check is load-bearing, not redundant: GitHub only
    # applies a template's labels that already exist in the repository and
    # silently drops the rest, so an intake issue can arrive with no label at
    # all. Gating on the label alone let those pass unprocessed -- no comment,
    # no PR -- which for a channel about never silently dropping a submission is
    # the worst possible failure. Junk that merely shares the prefix is caught
    # by the validator and answered with a comment, not silence.
    if: >-
      startsWith(github.event.issue.title, 'Budget intake:') ||
      contains(github.event.issue.labels.*.name, 'budget-intake')
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        # A short-lived installation token, minted per run -- no long-lived
        # secret, which is the whole reason this design refused a PAT. Used for
        # the checkout (so the push is the App's), and for gh (so the PR is the
        # App's). That identity matters: a push or PR made with the built-in
        # GITHUB_TOKEN does not start further workflows, so validate.yml would
        # never run on an intake PR; made by the App, it does.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INTAKE_APP_ID }}
          private-key: ${{ secrets.INTAKE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        # No lfs: the workflow WRITES a new LFS object; it needs none of the
        # existing corpus. provenance.yaml is a plain git file and is read
        # without a fetch. The App token is persisted so `git push` is the App.
        with:
          token: ${{ steps.app-token.outputs.token }}
          lfs: false

      - name: Install Git LFS filters
        run: git lfs install

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Process the submission
        # The issue body is attacker-controlled. It is passed as an environment
        # variable and read by the Node script from process.env -- it is NEVER
        # interpolated into this run block, which would be command execution for
        # an anonymous stranger holding a write token.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run intake
