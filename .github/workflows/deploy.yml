name: Deploy

# Merge to main -> full build (normalize, precompute baselines, generate site)
# -> deploy to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Selective LFS, same as validate.yml: fetch only what changed in the
          # merge, not the whole corpus. build:data reads intake filenames, not
          # bytes, so pointers are enough for everything but hash verification.
          lfs: false
          fetch-depth: 0

      - name: Cache LFS objects
        # Same LFS object cache as validate.yml, so a merge to main re-checks the
        # changed artifacts without re-downloading anything already seen.
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ github.sha }}
          restore-keys: |
            lfs-

      - name: Fetch only the changed LFS artifacts
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/lfs-pull-changed.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Validate before publishing
        # Deliberately re-run rather than trusting the PR check. Nothing
        # reaches the public site without passing validation immediately
        # beforehand.
        run: npm run validate

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build:data && npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
