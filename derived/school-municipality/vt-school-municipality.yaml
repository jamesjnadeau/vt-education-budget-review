schema_version: "1.0"
algorithm: geocode/school-municipality
algorithm_version: 1.0.0
basis: census_geocoder_point_in_polygon
note: "The municipality a school BUILDING stands in, resolved from AOE-published
  coordinates against Census county subdivisions. NOT derived from MailingCity:
  a postal city is not a municipality, and Vermont post office names routinely
  cover parts of several towns. The coordinates are AOE’s and carry no statement
  of precision, which is why the registry records geocode_precision as unknown
  and the distance criterion declines at that precision. Town assignment is far
  more forgiving of an imprecise coordinate than a ten-mile distance threshold
  is, but a school near a town line is the case to check by hand."
