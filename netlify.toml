# Netlify deploy configuration.
#
# Netlify is the only host. It builds from its own fresh clone, so the full
# pipeline (validate -> build:data -> build:site) runs here -- nothing reaches
# the public site without passing validation immediately beforehand.
#
# One-time Netlify site setup (UI, not this file): point the site at this
# repo, and add www.vermont-school-budgets.org as the primary custom domain.
#
# Also in the UI: PUBLIC_TURNSTILE_SITE_KEY, the public Cloudflare Turnstile
# site key the /contribute/ page renders its human check with. It is read at
# build time (Astro inlines PUBLIC_* variables), so changing it needs a new
# deploy. Without it the page's check cannot start and uploads are impossible.
# The matching secret, TURNSTILE_SECRET_KEY, is a function-only variable.

[build]
  command = "npm run build"
  publish = "site/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # engines.node in package.json requires >=22.
  NODE_VERSION = "22"
  # The intake corpus is stored in Git LFS. Validation hash-checks artifact
  # bytes, so Netlify must fetch real LFS content, not pointers.
  GIT_LFS_ENABLED = "true"
  # Used to build the GitHub deep links (coverage dashboard, SU pages).
  # Build-time only: functions cannot see this; they have their own default
  # (DEFAULT_REPOSITORY in tools/src/web-intake/limits.ts).
  GITHUB_REPOSITORY = "jamesjnadeau/vt-education-budget-review"

[context.production.environment]
  # Astro uses SITE_URL for canonical URLs, the sitemap, and rss.xml.
  SITE_URL = "https://www.vermont-school-budgets.org"
  # Cloudflare Web Analytics beacon is emitted only when this is '1'. Set for
  # production alone -- deploy previews and branch deploys never load it.
  PUBLIC_CF_ANALYTICS = "1"
  # PostHog is emitted only when this is '1' (production alone). The project
  # token and host are Netlify UI env vars, PUBLIC_POSTHOG_PROJECT_TOKEN and
  # PUBLIC_POSTHOG_HOST -- never committed.
  PUBLIC_POSTHOG_ENABLED = "1"

# Deploy previews and branch deploys leave SITE_URL unset; astro.config.mjs
# falls back to a placeholder, which only affects absolute URLs in
# sitemap/canonical tags -- fine for previews.
