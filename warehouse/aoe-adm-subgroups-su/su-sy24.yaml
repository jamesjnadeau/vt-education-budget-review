# AOE average daily membership by SUPERVISORY UNION, 2023-2024 (SY24).
#
# Transcribed from intake/aoe-adm-subgroups-su/fy2026/ADM_Sums_by_SU_Across_Years.csv
# by npm run adm:subgroups-su. Do not hand-edit: re-run the import instead.
#
# BASIS UNCONFIRMED. AOE has not said whether these count students by SU of
# residence, attendance or responsibility. SY24 equals the sum of member towns'
# resident ADM; SY25 and SY26 do not. Do not sum towns to an SU or merge this
# with warehouse/aoe-adm-subgroups (town of residence). See `basis` below.
schema_version: "1.0"
source: intake/aoe-adm-subgroups-su/fy2026/ADM_Sums_by_SU_Across_Years.csv
method: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql
school_year: SY24
count_year: 2023-2024
fiscal_year: 2025
preliminary: false
preliminary_note: null
grain: su
min_n: 11
basis:
  confirmed: false
  observed_against_town_sums: equals_town_residence_sums
  note: Whether these count students by SU of residence, attendance or responsibility has
    not been confirmed by AOE (not yet asked). SY24 equals the sum of the member towns'
    resident ADM in the town-of-residence record in every comparable cell, which is
    consistent with SU of residence.
suppression_rules:
  applicability: assumed_from_town_extract
  reporting_floor:
    text: 1. Reporting floor - an ADMTDIST/year whose total population is < 11 is not
      reportable
    source: "intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 1, min_n = 11
      (assumed: no documentation came with the SU file)"
  primary:
    text: 2. Primary - a cell with < 11 students is withheld
    source: "intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 2, min_n = 11
      (assumed: no documentation came with the SU file)"
  complement:
    text: 3. Complement - a subgroup is withheld when the students NOT in it are < 11
    source: "intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 3, min_n = 11
      (assumed: no documentation came with the SU file)"
  pair_member:
    text: 4. Complementary - across the four grade bands, a lone suppressed band is
      derivable by subtraction, so the next smallest non-empty band is also suppressed
    source: "intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 4, min_n = 11
      (assumed: no documentation came with the SU file)"
