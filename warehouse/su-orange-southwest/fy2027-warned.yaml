notes: "FY27 proposed budget as printed in the annual report for the March 3, 2026 vote (p. 25, 'Budget - Proposed
  Draft 3'): school budget $27,976,946 (matches line-item SCHOOL TOTAL on p. 24); categorical grant revenue
  $6,031,875; education spending (Act 68) $21,945,071 (= budget minus revenue); equalized LTW pupils 1,412.22
  (labelled '2025-26 (Projection 1/05/26)'); education spending per equalized pupil $15,539.41; excess spending
  threshold $16,470; amount over threshold $0; property yield $12,582.11; statewide adjustment 70.33%; equalized
  homestead rate $1.7561 (p. 5 says down 4.22% from last year's $1.8301). Total voter approval on the ballot is
  $29,159,606 = school total $27,976,946 + federal funds $1,182,660 (p. 24). Per-town rates are the 'Projected
  2026-27 Tax Rates' on p. 25 (equalized rate / statewide adjusted CLA); the CLAs recorded are the 'Statewide
  Adjusted CLA' column (89.39%, 108.92%, 134.98%) as ratios, not the raw 2025 town common level of appraisal
  (62.87%, 76.60%, 94.93%). Weighted pupils are one total, not grade bands. Vote result (not in the annual report):
  the district's 'Results of Budget Vote - Tuesday, March 3, 2026' (clerk-attested 3-6-2026) shows the $29,159,606
  budget passed, YES 836 / NO 407 / blank 28 / spoiled 1; staged at intake/su-orange-southwest/fy2027/21BudgetResults.pdf,
  source https://www.orangesouthwest.org/central-office/financial-budget-data. Status left 'warned' because this
  record transcribes the pre-vote document. The annual report has no AOE 'Three Prior Years Comparisons' table
  and does not print FY24-FY26 education spending, so no FY2024-FY2026 records were written."
