notes: 'FY2027 column of the AOE ''Three Prior Years Comparisons'' form for Winooski ID (T249), PDF p. 12 of the
  127th Annual Report (February 2026; text layer, rendered and checked). Total budget $37,048,854; offsetting revenues
  $4,912,223; education spending $32,136,631; pupils 2,157.00 (LTWADM); education spending per pupil $14,898.76;
  equalized district homestead rate $1.6837 (before CLA); income cap percent 2.45%. Re-added: budget minus revenue
  equals education spending; spending / pupils equals the printed per-pupil; equalized rate / CLA equals the town
  rate. Budget put to voters March 3, 2026 (annual report letter, p. 4; warning on https://www.wsdvt.org/school-board/budget/).
  Vote result per the City Clerk''s Official Return of Votes, https://winooskivt.gov/DocumentCenter/View/10778/ORV-3326-Final
  (scanned; read via text extraction): school budget article ($34,818,909) YES 696, NO 198, blanks 7, 901 ballots
  - i.e. approved; that return is not in the staged annual report, so this record stays ''warned'' with adopted_date
  null. The ballot article amount is $34,818,909 (Board ''operational budget'', = general fund incl. state aid,
  p. 11 ''Sub Total General Fund''); the AOE form''s $37,048,854 adds $2,229,945 of federal/other grant programs,
  which are also counted in offsetting revenues.'
