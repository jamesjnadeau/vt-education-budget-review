# by npm run adm:subgroups. Do not hand-edit: re-run the import instead, so the
# record always matches the hashed artifact.
#
# AOE suppressed small cells before release. A withheld cell is recorded as the bound
# its disclosure code implies and nothing tighter; constraints between cells are
# written down and never solved. A town missing from this file had no resident
# students that year (the query emits a row for every town-year with at least one).
