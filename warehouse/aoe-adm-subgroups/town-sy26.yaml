# AOE average daily membership by town of residence, 2025-2026 (SY26),
# in Act 127 grade bands with English-learner and free-or-reduced-lunch counts.
#
# Transcribed from intake/aoe-adm-subgroups/fy2026/ADM_Sums_by_ADMTDIST_Across_Years.xlsx
# by npm run adm:subgroups. Do not hand-edit: re-run the import instead, so the
# record always matches the hashed artifact.
#
# AOE suppressed small cells before release. A withheld cell is recorded as the bound
# its disclosure code implies and nothing tighter; constraints between cells are
# written down and never solved. A town missing from this file had no resident
# students that year (the query emits a row for every town-year with at least one).
schema_version: "1.0"
source: intake/aoe-adm-subgroups/fy2026/ADM_Sums_by_ADMTDIST_Across_Years.xlsx
method: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql
school_year: SY26
count_year: 2025-2026
fiscal_year: 2027
preliminary: true
preliminary_note: Seventeen SY26 values carry a denominator of 220 (20 x 11) that no
  SY24 or SY25 value does, which suggests an average over eleven periods rather than a
  settled full-year count. Whether SY26 is final was asked of AOE on 2026-09-11 and had
  not been answered when this was extracted; treated as preliminary until it is.
grain: town
min_n: 11
suppression_rules:
  reporting_floor:
    text: 1. Reporting floor - an ADMTDIST/year whose total population is < 11 is not
      reportable
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 1, min_n = 11
  primary:
    text: 2. Primary - a cell with < 11 students is withheld
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 2, min_n = 11
  complement:
    text: 3. Complement - a subgroup is withheld when the students NOT in it are < 11
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 3, min_n = 11
  pair_member:
    text: 4. Complementary - across the four grade bands, a lone suppressed band is
      derivable by subtraction, so the next smallest non-empty band is also suppressed
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 4, min_n = 11
