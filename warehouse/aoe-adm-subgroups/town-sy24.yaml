grain: town
min_n: 11
suppression_rules:
  reporting_floor:
    text: 1. Reporting floor - an ADMTDIST/year whose total population is < 11 is not
      reportable
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 1, min_n = 11
  primary:
    text: 2. Primary - a cell with < 11 students is withheld
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 2, min_n = 11
  complement:
    text: 3. Complement - a subgroup is withheld when the students NOT in it are < 11
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 3, min_n = 11
  pair_member:
    text: 4. Complementary - across the four grade bands, a lone suppressed band is
      derivable by subtraction, so the next smallest non-empty band is also suppressed
    source: intake/aoe-adm-subgroups/fy2026/adm_ferpa_suppressed_lea.sql rule 4, min_n = 11
