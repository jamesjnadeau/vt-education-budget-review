notes: >-
  Revised FY27 budget put to a revote on May 19, 2026: total budget $40,812,465
  (FY26 $39,291,626; +3.87%), from the Grand Total on p. 43 of the revised
  budget sheet. The ballot article (Final FY27 Budget Revote Informational
  Presentation, p. 8, same intake directory) states per-pupil education
  spending of $14,103.15, 2.48% higher than the current year. No AOE
  education-spending form, offsetting revenue, or LTWADM is in any staged
  document, so education_spending is null. The first FY27 budget ($40,895,465;
  per-pupil $14,137.22; warning dated Jan 22, 2026, March 3 vote) was
  followed by a revote, which implies the March 3 vote did not pass, but no
  staged document states the March 3 result; that first version is NOT
  recorded as a separate record here. Vote result for May 19: the district's
  Revised FY27 Budget page (https://www.mtsd-vt.org/page/fy27) is headed
  "SCHOOL BUDGET PASSED!" and its May 20, 2026 article
  (https://www.mtsd-vt.org/article/2923102/) thanks the community for
  "passing the FY27 School Budget". Reported count 972-851 (WCAX,
  https://www.wcax.com/2026/05/20/milton-voters-pass-revised-school-budget-with-deep-cuts/;
  WPTZ https://www.mynbc5.com/article/revised-school-budget-passes-milton/71357966).
  adopted_date is the revote date printed in the presentation and flyer.
