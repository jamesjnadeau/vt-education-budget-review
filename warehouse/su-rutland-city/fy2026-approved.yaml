notes: >-
  FY26 column ('FY26 Budget') of the district's January 13, 2026 slide. In $
  thousands: expenses $67,187; revenues, federal and local $23,831; 'State
  Funded' $43,356; LTW ADM 3,554.77; per pupil education spending $12,196.6.
  43,356 / 3,554.77 = 12,196.6. The slides label it 'FY26 Budget', not
  'adopted'. The City of Rutland's official March 4, 2025 results show the
  $67,187,000 school budget passed, Yes 2,296, No 1,346
  (https://www.rutlandcity.org/wp-content/uploads/2025/03/Election-Results-March-4-2025-3.xlsx);
  adopted_date is left null because the decks give no vote date. FY26 revenue
  detail (Jan 6 deck p. 4): federal grants 15,397; tuition 3,184; special ed
  and local 5,250; no working capital. The Jan 6 deck p. 6 chart prints
  $1.6058 for FY26 (a homestead rate; it is not labeled as town or equalized).
  No AOE education spending figure is printed; the nearest is 'State Funded'
  $43,356 thousand (not entered).
