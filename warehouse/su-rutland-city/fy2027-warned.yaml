notes: >-
  FY27 budget as ratified by the Board of School Commissioners on January 13,
  2026 and put to voters (Article #1 of the school ballot; Article 2 on the
  city ballot) at the March 3, 2026 city election. Figures are in $ thousands
  on the slides: expenses $69,836 (ballot $69,836,000); revenues, federal and
  local $26,640; 'State Funded' $43,196; LTW ADM 3,410.51; per pupil education
  spending $12,665.5 (ballot language rounds to $12,666, 3.8% higher than the
  current year). 43,196 / 3,410.51 = 12,665.5. No AOE education spending
  figure is printed; the nearest is 'State Funded' $43,196 thousand (not
  entered). Revenue detail (Jan 6 deck PDF p. 4): federal grants and
  reimbursements 14,769; tuition 3,250; working capital 3,150; special ed and
  local 5,471. Expenses by category (p. 3): compensation 55,610; direct
  instructional 3,860; special education 1,176; buildings, grounds,
  transportation 2,319; food service 1,840; financing 839; IT 1,265;
  utilities 777; other 2,150 (sums to 69,836). Vote result from the City of
  Rutland's official results, not the district page: Yes 1,688, No 1,520,
  overvote 1, undervote 67 (total 3,276), so the budget passed
  (https://www.rutlandcity.org/wp-content/uploads/2026/03/Election-Results-March-3-2026.xlsx).
  The district's own pages were not found to state the result. adopted_date is
  left null because the decks do not state a vote date.
