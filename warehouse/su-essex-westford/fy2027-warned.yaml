notes: "FY27 budget put to voters April 14, 2026 (Article 2): total budget $102,014,901 (p. 4/6 tables;
  the warning on p. 8 prints $102,014,902); offsetting revenues $21,753,415; 'Net Education Spending'
  $80,261,486 (the figure recorded as education spending); LTWADM 5,547.36; spending per LTWADM $14,468
  (+2.82% vs FY26 $14,072; the warning also prints $14,468 and 2.82%); estimated homestead yield $8,849;
  estimated equalized homestead rate $1.6350, $1.5582 after the $0.0768 Act 127 credit (+1.38%). Town
  rates are the printed 'Estimated ... Tax Rate after CLA' figures, which are after the Act 127 credit;
  CLAs are not printed. Separate CTE (Center for Technology Essex) FY27 budget $9,747,737 (Article 4)
  is not included in these figures. Vote result: the district reports Article 2 passed 1,875-1,165
  (https://www.ewsd.org/article/2822090 and https://www.ewsd.org/page/ewsd-budget-fy27). The PDF is
  image-only; figures were read from renders and re-added (102,014,901 - 21,753,415 = 80,261,486;
  80,261,486 / 5,547.36 = 14,468.2)."
