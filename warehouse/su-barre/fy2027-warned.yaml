notes: "FY27 budget as first put to voters (warning for March 3, 2026; board-adopted Jan 20, 2026): total general-fund budget $57,829,257 (+3.36% over FY26 $55,949,143); education spending $45,501,740 (revenue-summary line); other general-fund revenue $12,327,517 (tuition, interest, transportation aid, Census Block Act 173 $5,132,517, special ed $4,944,000, CVCC $500,000, fund balance $100,000, misc); federal and state grants of $3,000,000 are outside the general fund (total BUUSD revenue $60,829,257). Ballot per-pupil education spending $12,982 (13.12% above current year); the pupil count is LTWADM, not printed as a number. VOTE HISTORY (district Vote 4 slides): Mar 3 2026 not approved; May 12 2026 ($12,748 per pupil) not approved; Sept 15 2026 ($57,129,257, $12,648) not approved; Nov 3 2026 revote $56,621,592 (+1.20%, $12,503 per pupil, 8.95% above current year; warning in intake). The district's own site (buusd.org home and budget pages) does not state the Nov 3 result as of 2026-11-28. Press reports it APPROVED: 2,872 yes to 1,665 no combined, Barre City 1,287-773, Barre Town 1,599-1,263 (https://www.wcax.com/2026/11/04/barre-residents-approve-566-million-school-budget/ and https://vtdigger.org/2026/11/04/barre-voters-approve-school-district-budget-on-4th-attempt/). The approved FY27 figure is $56,621,592; its education spending is not printed in any staged document, so this record holds only the March-vote version and is status warned."
