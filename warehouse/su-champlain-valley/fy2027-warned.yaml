notes: "FY27 budget put to voters on March 3, 2026 (Article VII, warning pp. 158-159, 170): total union budget $107,860,285; offsetting union revenues $16,485,405 (includes $1,000,000 fund-balance application); education spending $91,374,880; LTWADM 5,724.51; education spending per pupil $15,962.04 (warning rounds to $15,962, '2.7% higher'); union spending adjustment 180.382%; equalized union homestead rate $1.8038 before the $0.145 cent discount (statewide adjuster 70.33%) and $1.6588 after; income cap 2.63%; property yield $8,849, income yield $12,154. Town rates are the 'Estimated Homestead Rate w/ CLA Applied' on pp. 27 and 61-62 (equalized $1.66 / CLA), printed to the cent; CLAs printed as whole percents (116%, 153%, 77%, 79%, 82%) and recorded as ratios. Vote result: the budget passed 4,085-2,210 across the five member towns (Hinesburg Record, https://www.hinesburgrecord.org/p/voters-approve-municipal-budgets, Mar 4 2026, a local newspaper citing the Hinesburg clerk; not a district or town page; the district says ballots are commingled so per-town counts do not exist). Re-added: 107,860,285 - 16,485,405 = 91,374,880; 91,374,880 / 5,724.51 = 15,962.04; 15,962.04 / 8,849 = 1.8038. The 1.66 per $100 in the narrative equals the form's 1.6588 rounded."
