notes: 'FY27 budget as revised for the April 14, 2026 revote and approved 601 Yes to 374 No (certified result PDF
  staged in the same intake dir; district clerk Nola Gilbert). Total operating budget $52,153,854; projected revenues
  $12,855,806 (includes unreserved fund balance $2,219,780); education spending PreK-12 $39,298,048; LTWADM 3,228.17;
  spending per LTWADM $12,173; property yield $9,373 (estimate); PreK-12 equalized tax rate equivalent $1.2988.
  FY26 comparison column in the same image: budget $50,956,879, education spending $39,683,045, LTWADM 3,255.49,
  $12,190 per pupil, rate $1.4181. The first FY27 budget ($52,440,854; per pupil $12,351) was defeated March 3,
  2026 (https://www.mvsdschools.org/apps/pages/index.jsp?uREC_ID=3916577&type=d&pREC_ID=2531584). Newspaper corroboration
  of the revote count: https://www.wcax.com/2026/04/15/multiple-school-district-budgets-pass-tuesday/. Parking-lot
  special article ($1,270,500) was also defeated on March 3 per the district page (''voted down''); it is not part
  of this record. One budget-setting district (MVSD) covers Franklin, Highgate and Swanton.'
