notes: "FY27 budget as printed in the 2025-26 annual report for the March 3, 2026 Australian-ballot vote:
  total budget $64,963,496 (PDF p. 43 detail total; the official warning Article 4 prints the same amount and
  estimates per-pupil education spending of $15,771, 9.79% above the current year). The annual report has no AOE
  education-spending form; the nearest printed figure is the district's own 'Education Spending' $55,066,098
  (PDF p. 33 estimated homestead tax rate chart and PDF p. 32 five-year chart), which implies offsetting revenues of
  $9,897,398 (budget minus that figure; not printed as such). Estimated equalized pupils 3,491.64 (FY26 3,515.00);
  education spending per equalized pupil $15,771 (+9.78%); estimated property yield 8,849; spending adjustment
  178.22%; Act 127 discount ($0.1109); estimated equalized homestead rate $1.6713 (FY26 $1.5268). The district
  fact sheet (FY27_Budget_Fact_Sheet_Final.pdf, not staged) states LTW ADM 3,490. Town rates are 'Proposed
  Equalized Homestead Tax Rate adjusted for CLA' (PDF p. 33); cla is the 'FY27 Adjusted CLA (%)' from PDF p. 34
  (unadjusted CLA / 70.33% statewide adjustment), as a ratio; each rate = $1.6713 / cla (re-added). Prior-year
  columns: FY26 education spending $50,496,414, FY26 total budget $61,290,046 (chart) or $61,290,047 (detail);
  FY25 education spending $49,838,416; no AOE form printed, so no FY26/FY25 records were written. Vote result:
  approved 2,251 to 1,290 (64%) per the district's own superintendent letter dated March 4, 2026,
  https://drive.google.com/file/d/1wMwVtKQc5r1Vpw5XSPj0YvRAi2kbIkij/view (staged in intake/su-mount-mansfield/fy2027);
  not a certified result. Status stays warned because this record's source is the pre-vote document; adopted_date
  left null."
