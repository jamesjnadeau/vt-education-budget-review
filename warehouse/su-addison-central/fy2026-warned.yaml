notes: >-
  FY26 proposed budget as printed in the voter overview for the March 4, 2025 vote (Education
  Spending Projection box, "Operations and Finance Director's Message"): total expense (incl.
  fund balance) $51,719,284; offsetting revenue $10,346,674; projected FY26 ed spending
  $41,372,610; FY25 ed spending $40,041,512; difference $1,331,098 (3.32%). Re-added: 51,719,284 -
  10,346,674 = 41,372,610; 41,372,610 - 40,041,512 = 1,331,098. The same FY26 figures (budget
  $51,719,284, revenue $10,346,674, ed spending $41,372,610) appear in the FY2026 column of the AOE
  form in the FY27 budget book (intake/su-addison-central/fy2027/FY27BudgetBookMaster.pdf p. 11), which also
  prints 2,743.20 pupils and $15,081.88 per pupil there (FY27 book p. 32 prints FY26 LTWADM
  2,740.36 and $15,098). This overview prints no pupil count or per-pupil figure. The full FY26
  budget book is on the district page only as a Google Drive embed with downloads disabled, so it
  was not read. Vote result: not found on the district FY26 page or in the documents read.
