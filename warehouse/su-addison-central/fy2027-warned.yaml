notes: >-
  FY27 budget warned for the March 3, 2026 Australian ballot (p. 8, Article 1: expend $52,999,495;
  estimated per pupil education spending $15,638.00, 3.58% above current year). Financial
  summary (p. 24): total expenses, all funds $52,999,495; total revenues, all funds $10,423,357
  (tuition, state and local grants $4,333,472; special education block grant $3,992,885; revenue
  from other funds $2,097,000; fund balance transfer $0); education spending $42,576,137, +$1,203,527
  (+2.91%) over FY26 $41,372,610. LTWADM 2,722.55 (FY26 2,740.36), ed spending per LTWADM $15,638
  (FY26 $15,098, +3.58%); excess spending threshold $16,331 per LTWADM, 4% below (p. 32).
  Projected adjusted equalized district homestead rate $1.65 (+$0.035, +2.19%), yield $8,849 (p. 32).
  Income yield $12,154, 2.6% of income (p. 33). Town rates are the p. 35 "Preliminary Town Tax
  Rate Projection" (Projected FY27 Tax Rate = $1.65 / Projected Adjusted CLA), printed to the cent
  with whole-percent CLAs, recorded here as ratios. Re-added: 52,999,495 - 10,423,357 = 42,576,138
  (printed 42,576,137, $1 apart); 42,576,137 / 2,722.55 = 15,638; 1.65 / CLA reproduces each printed
  town rate to the cent. Vote result: the district home page (https://www.acsdvt.org/, "Town
  Meeting 2026 Results") says voters gave "overwhelming support" to the FY2027 budget and approved
  closure of Ripton Elementary School; no tally is stated there, and no town-by-town numbers were
  read. Adopted date left null: the warning gives the vote date (March 3, 2026) but the result
  figures were not found.
