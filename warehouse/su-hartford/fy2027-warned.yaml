notes: >-
  FY27 proposed budget put to voters 3 Mar 2026 (Article 2: expend $58,707,341; estimated $17,677.97 per equalized pupil, 10.24% above the current year, per the warning in intake/su-hartford/fy2027/2026_school_dist_warnings_both.pdf). Source is the p. 11 'Vermont State Education Tax for Hartford School District' form, which is the district's own form, not an image of the AOE form, and is not stamped preliminary or estimate. Figures as printed: total expenditure budget all funds $58,707,341 (p. 2 and p. 11 line 2); revenues without state education tax $21,589,444; education spending $37,117,897; long-term weighted average pupils 2,099.67 (LTWADM); education spending per weighted pupil $17,677.97; homestead rate $1.3924; non-homestead rate $1.2669; CLA 140.89%. Budget minus revenue and spending divided by pupils both re-add to the printed figures. Vote result: PASSED, Yes 763 / No 542 (1,372 ballots counted), per the Town Clerk's certificate of results attested 4 Mar 2026, https://files.smartsites.parentsquare.com/11463/2026_official_school_dist_results.pdf (staged in intake). Status is warned because the source document is the pre-vote packet; adopted_date is left null because the packet itself states no vote date (the certificate gives 2026-03-03).
