notes: >-
  FY2027 proposed budget put to voters on March 3, 2026. Total budget $73,939,121 (the book's overview prints $73,939,121.04); offsetting revenues $12,405,938; education spending $61,533,183; pupils 3,920.28 LTWADM; education spending per pupil $15,696.12; equalized homestead rate $1.7738; income cap percent 2.58%. Town rate and CLA are the form's lines 33 and 32 (CLA divided by statewide adjustment, recorded as a ratio); South Burlington is the only town. Re-added: budget minus revenue equals education spending; spending / pupils equals the printed per-pupil. Vote: the district's FY27 budget page (https://www.sbschools.net/page/fy27-budget-information/) says voters approved the FY27 budget on Tuesday, March 3, 2026; the city's certified results (https://www.southburlingtonvt.gov/697/March-3-2026-Town-Meeting-Day-Results) show School Article II Yes 1,915 / No 1,777. The budget book itself predates the vote, so this record is kept as warned; a human may promote it to approved. The estimated FY27 rates are as of the Dec 1, 2025 Education Fund Outlook (yield $8,849) and the 70.33% statewide adjuster; final rates were to be set by the Legislature.
