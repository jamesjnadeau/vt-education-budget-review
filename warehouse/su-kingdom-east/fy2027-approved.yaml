notes: 'FY27 budget as passed on the third vote, June 11, 2026: Article 1, expend $53,251,362 (district summary:
  ''Total Proposed Expense Budget: $53,251,362''), estimated per-pupil education spending $14,742 (+7.08% over the
  current year per the warning). Vote result: PASSED 969 yes, 944 no; a recount on June 23, 2026 confirmed it (district
  page https://www.kingdomeast.org/fy27-budget). Earlier versions: $53,401,362 failed March 3, 2026 (632-730); $53,251,362
  failed April 28, 2026 (460-614, Caledonian Record, secondary). The vote #3 version differs from the second only
  in applying an additional $250,000 of Tax Stabilization Funds (total $850,000), per the vote #3 taxpayer summary
  (Budget_Vote3_Taxpayer_Summary #1.pdf, same intake folder), so the expenditure total is the same as vote #2. Education
  spending dollars not printed in any staged document: left null, nearest printed figure is the $14,742 per pupil.'
