notes: 'FY27 budget as first warned for the March 3, 2026 Town Meeting vote, from the AOE form (PDF p. 22) and Charts
  1/7/8: total union budget $53,401,362 (FY26 $50,349,157, +6.06%); offsetting union revenues $6,124,879; education
  spending $47,276,483; LTWADM 3,179.88; education spending per pupil $14,867.38 (+7.99% over FY26 $13,767.47);
  excess spending threshold $16,470; property dollar equivalent yield $9,212; equalized union homestead rate $1.6139
  (+0.77% vs FY26 $1.6016); income cap 2.45%. Budget minus revenues equals education spending, and spending / LTWADM
  equals the printed per-pupil figure (rechecked). Vote result: FAILED 632 yes, 730 no (district results page https://www.kingdomeast.org/kingdom-east-fy27-budget-results,
  Article 4, 1,414 ballots cast). Revised $53,251,362 budget failed April 28, 2026 (460-614, Caledonian Record).
  The version that passed is in fy2027-approved.'
