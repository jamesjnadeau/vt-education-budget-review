- path: education_spending
  issue: 'The AOE ''Three Prior Years Comparisons'' form is stamped PRELIMINARY and is an image; its FY2027 column
    is shaded/estimated, and the right edge of the page (including the title-bar word that begins ''ES'') is cut
    off by a black bar in the district''s pasted image. Footnote: figures are based on the Dec 1, 2025 Education
    Fund outlook ($9,212 yield) and ''new and updated data will likely change the proposed property and income yields'';
    final figures are set by the Legislature. Chart 7 and 8 (pp. 19-20) say the estimated rates assume a one-time
    $75M General Fund transfer.'
  resolution: pending
- path: tax.towns.homestead_rate_stated
  issue: 'Rates are the district''s ''FY27 Estimated Town Tax Rate'' from Chart 8 (PDF p. 20): union estimated rate
    $1.6139 divided by the printed CLA. CLAs are printed as percentages (e.g. 115.11%) and include a statewide adjustment
    of 70.33%; they are estimates (''subject to change''), not the Tax Department''s final CLAs. Each town rate
    recomputes from 1.6139/CLA to within $0.0001 (Lunenburg prints 1.1942; 1.6139/1.3515 = 1.19415).'
  resolution: recorded_as_other
