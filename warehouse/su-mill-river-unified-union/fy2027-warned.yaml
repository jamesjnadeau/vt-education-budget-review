notes: 'FY2027 budget as warned in the 2026 annual report for the Feb 26 / Mar 3, 2026 meeting (Article
  4). Total union budget $22,817,989 (+3.52% over FY26; p. 14); offsetting union revenues $5,579,558;
  education spending $17,238,431; LTWADM 1,219.80; education spending per pupil $14,132.18 on the p. 25
  form ($14,132.29 in the warning, p. 31); anticipated equalized union homestead rate $1.5970 (yield $8,849),
  income cap 2.33%; printed prorated rate for each of the four towns $1.5970 (not CLA-adjusted). Operating
  fund summary (p. 15): total revenue $21,567,989 plus $1,250,000 of surplus applied = $22,817,989; this
  revenue includes the $16,972,504 state Education Spending Grant and is a different measure from the
  form''s $5,579,558 offsetting revenues. Article 5 (separate) asks to move $1,000,000 of surplus to the
  building sinking fund. Vote result: not stated in the report. Rutland Herald (Mar 4, 2026) reports the
  budget approved 515-469 and the $1,000,000 transfer approved 625-352: https://www.rutlandherald.com/news/local/rutland-county-sees-only-two-school-budgets-fail-this-town-meeting-day/article_5bf79bf2-e1a1-44b7-b34d-24d5a09a824f.html
