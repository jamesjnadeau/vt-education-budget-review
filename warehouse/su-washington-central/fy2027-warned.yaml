notes: "FY2027 column of the AOE 'Three Prior Years Comparisons' form in the WCUUSD Annual Report 2026 (PDF p. 31, stamped PRELIMINARY ESTIMATES ONLY). Union budget $43,271,845; offsetting union revenues $6,934,032; education spending $36,337,813 (budget minus revenue re-added, matches); pupils 2,219.40 (LTWADM); education spending per pupil $16,372.81 (spending / pupils re-computed, matches); equalized union homestead rate $1.7773 (no cent discount printed on line 28). Budget put to voters by Australian ballot at the WCUUSD annual meeting on March 3, 2026 (Article 5). Vote result: approved 1,684 yes to 1,379 no (66 undervotes, 0 overvotes), per the district clerk's Certification of Final Votes, image-only PDF at https://resources.finalsite.net/images/v1772631374/wcsu32org/z90f8s5pmgvhy7meh8p2/Voteresults3326_1.pdf (linked from https://www.wcuusd.org/school-board/vote-results; read from a rendered image). The vote result is not in the staged annual report, so adopted_date stays null and the record stays 'warned' (the document's own status); the district's tax pages also state the same ballot per-pupil $16,372.81, 7.21% over the current year. Annual report p. 32 projects tax-bill changes per $100,000 home: Berlin +$35.80, Calais +$259.00, East Montpelier +$214.40, Middlesex +$245.70, Worcester -$39.90. The same $43,271,845 / $6,934,032 / $36,337,813 appear in the staged FY27 Final Warned Budget (3-school version)."
