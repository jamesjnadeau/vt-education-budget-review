notes: 'Revised FY27 budget put to the March 31, 2026 revote: total expenditures $32,307,262.49 (grand total, PDF
  p. 46 of the detail budget; $202,526.51 below the original $32,509,789; +2.16% over FY26 $31,623,010.89 on the
  same page). Vote result: approved, 778 yes / 546 no on March 31, 2026 per https://mountaintimes.info/2026/04/15/otter-valley-budget-squeaks-by
  (newspaper count, not an official canvass); the district''s own live feed (https://www.slatevalleyunified.org/live-feed?page_no=8,
  as found by search, not opened in full) thanks voters ''for your support in approving the school budget on the
  revote'' and describes the revised budget as $32.3 million. adopted_date left null because no staged document
  states the result date. The staged detail budget prints expenditures only: no offsetting revenues, education spending
  or pupil count for the revised budget, and no revised AOE form was found.'
