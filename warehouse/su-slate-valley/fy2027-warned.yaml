  yield; union spending adjustment 135.244%); income cap percent 2.00% (income yield $12,154). VOTE: defeated March
  3, 2026, 952 yes / 1,125 no per https://mountaintimes.info/2026/03/11/voters-approve-a-majority-of-town-meeting-day-school-budgets
