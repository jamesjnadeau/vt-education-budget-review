notes: >-
  FY2027 budget put to voters on Australian ballot March 3, 2026 (Article 1).
  The report has no AOE form; figures are from the district's own "Estimated
  Homestead Tax Rates" table (p. 11): total expenditures $31,830,266 (+5.34%
  over FY2026 $30,217,239); total revenues $5,484,947 (includes $250,000
  anticipated FY2025 surplus); "Net Education Spending" $26,345,319; LTW average
  daily membership 1,820; education spending per pupil $14,479 (+8.39%); dollar
  equivalent yield $9,212; school district tax rate $1.5627; "2025 statewide
  adjustment to CLA" 1.3744; estimated homestead tax rate $1.1370 (p. 11; the
  letter on p. 9 rounds to $1.14, +$0.074). The rate is a district estimate
  that includes the anticipated state buy-down, marked preliminary. Article 1
  (and the ballot, p. 10 and 20) says $31,830,266 and education spending of
  $14,479 per pupil. Article 2 asks to put up to 50% of the FY2025 surplus into
  a capital reserve fund. Vote result: not on the district or town sites read;
  local outlet News7 reports Article 1 passed 627 to 606
  (https://www.news7newslinc.net/index.php/around-the-nek/st-johnsbury,
  retrieved 2026-11-28); not independently confirmed, so adopted_date stays null.
  Article 2 result not found.
