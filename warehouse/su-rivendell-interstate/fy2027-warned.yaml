notes: 'This is the VERMONT (Unified) share of an interstate district, taken from the AOE-format ''VT Three Prior
  Years Comparisons'' form (PDF p. 16, printed p. 13); the Orford NH share is not on it. FY2027 as warned for the
  March 21, 2026 district meeting (Article 4: $16,604,487 operating budget for the whole district; Article 5: apply
  $450,000 of unassigned fund balance to offset tax rates, $320,251 of it the Vermont share). VT form: union budget
  $12,305,543 (VT share, 71.17% by ADM); offsetting revenues $3,459,225; education spending $8,846,318; Vermont
  LTWADM 537.29; per pupil $16,464.70; union spending adjustment 178.731%; equalized union homestead rate $1.7873
  (cent discount adjusted by the 70.33% statewide adjuster); income cap 2.51%. Education spending is the form''s
  figure and ASSUMES Article 5 passes (revenues include the $320,251 surplus share); without it VT assessments are
  $9,166,569 (PDF p. 10). Town rates are the ''Equals Estimated Vermont Local Education Tax Rates per $100'' on
  PDF p. 15 (equalized rate / statewide-adjusted CLA); cla is the ''Statewide Adjusted CLA'' ratio (122.68%, 91.91%,
  132.59%). Unadjusted town CLAs printed: Fairlee 86.28%, West Fairlee 64.64%, Vershire 93.25%. Whole-district (RISD)
  figures: expenditure budget $16,604,487, funds raised by taxes $12,690,084 before the surplus ($12,240,084 after).
  Orford (NH) share: education spending $4,298,945, assessment $3,523,515, estimated rate $11.95 per $1,000. Vote
  result: not stated in this document or found on the district site; the Valley News reports approval 135-83 with
  two blanks (https://vnews.com/2026/03/22/rivendell-school-budget-approved), not used for adopted_date.'
