- path: notes
  issue: The p. 23 ballot explainer is headed 'MARCH 4, 2025' but the vote was March 3, 2026 (confirmed by the warning
    PDF p. 1 and the district blog). Its callout says '$51,844,847 provides education for 1787 students' while Article
    V and the p. 19 and p. 22 figures are $51,884,847 (digits transposed).
  resolution: pending
- path: tax.towns.homestead_rate_stated
  issue: p. 22 prints a 'prorated homestead union tax rate' of $1.7570 for each of the six towns (after the cent
