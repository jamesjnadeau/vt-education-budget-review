notes: 'FY27 proposed budget as printed in the annual report for the March 3, 2026 vote: total union budget $51,884,847
  (+5.44% over FY26 $49,209,927); offsetting union revenues $9,283,479; education spending $42,601,368 (+$1,413,253
  / 3.43% vs FY26); LTWADM 2,625.05 (raw enrollment 1787 incl. PreK); education spending per pupil $16,228.78 (+4.80%);
  excess spending threshold $16,470; equalized union homestead rate $1.8340, $1.7570 after the $0.077 cent discount,
  same for all six towns; income cap percent 2.67%; construction cost per pupil $214.78. Arithmetic re-checked:
  budget minus revenue equals education spending; spending / LTWADM equals the printed per-pupil. Vote: the district''s
  blog says ''FY27 Budget Passes'' (March 4, 2026, https://huusd.org/blog/fy27-budget-passes); the Waterbury Roundabout
  reports 2,104 to 1,343 (https://www.waterburyroundabout.org/news-archive/by-a-wide-margin-voters-approve-519m-harwood-budget-4t3x2).
  Article VI, a separate $500,000 maintenance reserve allocation, was reported passing 2,687 to 736. Status stays
  ''warned'' because this is the budget as printed in the document; adopted_date is null (newspaper counts are not
  recorded there). Harwood Unified Union School District #60 is the only member district of the SU and sets the
  budget for all six towns.'
