notes: Prior-year column of the FY27 annual report's AOE 'Three Prior Years Comparisons' form (PDF p. 22, stamped
  PRELIMINARY), printed as the adopted/warned union budget; no vote date is given, so adopted_date is null. Total
  union budget $47,892,873; offsetting union revenues $7,516,591; education spending $40,376,282; LTWADM 2,647.61;
  education spending per pupil $15,250.09; equalized union homestead rate $1.4515, same for all six towns. Arithmetic
  re-checked (budget minus revenue = education spending; spending / pupils = per-pupil). Income cap percent 2.84%.
  A third-party source says the FY25 budget was a revised version passed after the first proposal was defeated in
  March 2024 (https://hungermountaini.com/huusd/budget/); the report does not say so.
