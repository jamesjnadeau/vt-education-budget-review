notes: 'FY27 budget put to voters at the Feb 28, 2026 annual school district meeting (Article 6: expend $5,407,140.12;
  the AOE form prints $5,407,140). AOE form: budget $5,407,140; offsetting revenues $869,544; education spending
  $4,537,596; LTWADM 330.98; per pupil $13,709.58 (excess spending threshold $16,470, no excess); equalized union
  homestead rate $1.5493, $1.5273 after the $0.022 cent discount; income cap percent 2.26%. Re-added: 5,407,140
  - 869,544 = 4,537,596; 4,537,596 / 330.98 = 13,709.58. Vote result: the district''s DRAFT minutes (staged in intake;
  https://lincolnsd.org/s/2026-Feb-28-LSD-Minutes-DRAFT-1.pdf, PDF p. 2) record Article 6 as passed by clicker vote,
  YES 137, NO 17. The district''s page https://lincolnsd.org/budget-1 labels the budget ''FY27 Adopted Budget (adopted
  1/13/26)''; that is the board''s adoption of the warned budget, not the voter approval. adopted_date is left null
  because this record is the warned budget. After the legislature acted, the district''s statement (https://lincolnsd.org/budget-1,
  not staged) updates the homestead rate to $1.0653 and the income rate to 2.09%.'
