name: the growing school the two enrollment bases disagree about
why: |
  A school at 40 two years ago and 110 last year averages to 75, an average
  grade size of 10 across K-6's seven grades, and meets the screen; read on the
  latest year alone it is 15 and does not. Same school, same published figures,
  opposite answer, decided by which enrollment basis is used. Act 170 fixes the
  two-year average, so this fixture shows what a single-year shortcut would get
  wrong.

thresholds:
  enrollment: { threshold: 12, comparator: lt }
  density: { threshold: 55, comparator: lt }

school:
  grade_span: { low: 0, high: 6 }
  school_type: public
  municipality_basis: census_geocoder_point_in_polygon

inputs:
  enrollment_by_year: { 2028: 40, 2029: 110 }
  municipality:
    population: 1000
    land_area_sq_mi: 40
    water_area_sq_mi: 0
    series: decennial_2020

options:
  fiscal_year: 2030
  enrollment_basis: two_year_average

expected:
  average_grade_size: 10
  small_screen_met: true
  density_value: 25
  sparse_screen_met: true
  grant_amount: null
  under_single_year_basis:
    average_grade_size: 15
    small_screen_met: false
