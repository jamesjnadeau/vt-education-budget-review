name: a school whose status depends on which enrollment basis the statute means
why: |
  A publishable finding rather than a mere regression. This shrinking school
  enrolled 130 two years ago and 50 last year. On the two-year average of 90
  across K-6's seven grades its average grade size is 12, which does not meet
  the under-12 screen; on the latest year alone it is 7, which does. The statute
  fixes the two-year basis, so single-year is a scenario, not a reading.

  The set of Vermont schools whose answer depends on the reading is the story
  here, not any one school's number.

thresholds:
  enrollment: { threshold: 12, comparator: lt }
  density: { threshold: 55, comparator: lt }

school:
  grade_span: { low: 0, high: 6 }
  school_type: public
  municipality_basis: census_geocoder_point_in_polygon

inputs:
  enrollment_by_year: { 2028: 130, 2029: 50 }
  municipality:
    population: 1000
    land_area_sq_mi: 40
    water_area_sq_mi: 0
    series: decennial_2020

options:
  fiscal_year: 2030
  enrollment_basis: two_year_average

expected:
  average_grade_size: 12
  small_screen_met: false
  density_value: 25
  sparse_screen_met: true
  grant_amount: null
  # The same school under the other reading of the statute. The runner computes
  # it and asserts it, so the divergence is a tested fact and not a claim.
  under_single_year_basis:
    average_grade_size: 7
    small_screen_met: true
