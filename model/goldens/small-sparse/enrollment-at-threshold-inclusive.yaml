name: the same school, read with an inclusive comparator
why: |
  The paired half of enrollment-at-threshold. Same school, same enrollment,
  opposite answer -- the whole difference being one word in a statute nobody has
  read yet. Kept as its own fixture so the divergence is visible in the test
  names rather than buried inside one assertion.

thresholds:
  enrollment: { threshold: 100, comparator: lte }
  density: { threshold: 55, comparator: lt }

school:
  grade_span: { low: 0, high: 6 }
  school_type: public
  municipality_basis: census_geocoder_point_in_polygon

inputs:
  enrollment_by_year: { 2028: 100, 2029: 100 }
  municipality:
    population: 1000
    land_area_sq_mi: 40
    water_area_sq_mi: 0
    series: decennial_2020

options:
  fiscal_year: 2030
  enrollment_basis: two_year_average

expected:
  enrollment_value: 100
  small_screen_met: true
  density_value: 25
  sparse_screen_met: true
  grant_amount: null
