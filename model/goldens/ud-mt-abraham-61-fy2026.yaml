# Mt. Abraham Unified School District, FY2026: an Act 84 transition district.
#
# What the State published: $14,718.91 per weighted pupil (AOE) and a district
# rate of 1.6903 (Tax Department). 32 V.S.A. § 5401(13)(A) alone gives
# 14,718.91 / 8,596 = 1.7123. The difference is the Act 127 tax rate transition,
# 2024 Acts No. 84, Sec. 3, as amended by 2024 Acts No. 183, Sec. 16:
#
#   FY2025 decrease (AOE worksheet, 2 percent relative decrease)      $0.02
#   FY2026 share, Sec. 3(c)(1)                                  x 0.80 = 0.016
#   divided by the FY2026 statewide adjustment 0.7236                  = 0.0221
#   rounded to three places (Tax Department convention, not statute)   = 0.022
#   1.712297 - 0.022                                                   = 1.6903
#
# The smallest decrease on the worksheet, so it checks that small decreases
# are applied rather than lost to rounding. Lincoln left the district before
# FY2026 and is not a member. See docs/act-127-transition.md.
#
# Spending and pupils: warehouse/aoe-edspend/fy2026.yaml, district row 25,
# town rows 17-20. CLA and rates: intake/tax-rates/fy2026/FY26EdTaxRates_081825.xlsx.
entity: ud/mt-abraham-61
