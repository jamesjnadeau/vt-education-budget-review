# Champlain Valley Unified School District, FY2026: an Act 84 transition district.
#
# What the State published: $15,535.13 per weighted pupil (AOE) and a district
# rate of 1.6193 (Tax Department). 32 V.S.A. § 5401(13)(A) alone gives
# 15,535.13 / 8,596 = 1.8073. The difference is the Act 127 tax rate transition,
# 2024 Acts No. 84, Sec. 3, as amended by 2024 Acts No. 183, Sec. 16:
#
#   FY2025 decrease (AOE worksheet, 17 percent relative decrease)     $0.17
#   FY2026 share, Sec. 3(c)(1)                                  x 0.80 = 0.136
#   divided by the FY2026 statewide adjustment 0.7236                  = 0.1880
#   rounded to three places (Tax Department convention, not statute)   = 0.188
#   1.807251 - 0.188                                                   = 1.6193
#
# The largest decrease of the four transition fixtures, so the one where a
# wrong share or a missing division by the statewide adjustment shows most.
# See docs/act-127-transition.md.
#
# Spending and pupils: warehouse/aoe-edspend/fy2026.yaml, district row 149,
# town rows 139-142 and Williston. CLA and rates:
# intake/tax-rates/fy2026/FY26EdTaxRates_081825.xlsx.
entity: ud/champlain-valley-56
fiscal_year: 2026

source:
  publisher: Vermont Agency of Education and Vermont Department of Taxes
  document: >-
    AOE EdSpend_LTWADM_FY26_FY25_FY24_FY23.xlsx, tab FY26 (Data Request #853;
    warehouse/aoe-edspend/fy2026.yaml); Department of Taxes "FY2026 Education
    Property Tax Rates", FY26EdTaxRates_081825.xlsx dated 2025-08-18
    (intake/tax-rates/fy2026/)
  url: https://tax.vermont.gov/document/fy2026-education-property-tax-rates
  retrieved: "2026-10-22"
  retrieved_by: Claude Code session, for James Nadeau

inputs:
  weighted_membership_published: 5683.51
  education_spending: 88294084
  statewide_average_per_pupil: 13497
  act84_transition:
    fy2025_rate_decrease: 0.17
    source: >-
      AOE "FY25 to FY29 Act 127 Tax Rate Discount by District", 2024-02-08, row
      "14 Champlain Valley USD", FY25 column
      (intake/aoe-guidance/2024-02-08-act-84-tax-rate-discount/)
  towns:
    - { town: town/charlotte, cla: 0.9320 }
    - { town: town/hinesburg, cla: 1.1480 }
    - { town: town/st-george, cla: 0.6503 }
    - { town: town/shelburne, cla: 0.6240 }
    - { town: town/williston, cla: 0.6289 }

expected:
  per_weighted_pupil: 15535.13
  # The Tax Department's figures, after the Act 84 decrease.
  equalized_homestead_rate: 1.6193
  town_rates:
    - { town: town/charlotte, billed_rate: 1.2572 }
    - { town: town/hinesburg, billed_rate: 1.0207 }
    - { town: town/st-george, billed_rate: 1.8018 }
    - { town: town/shelburne, billed_rate: 1.8777 }
    # Williston is left out: published 1.8632 = 1.6193 / 0.8691, CLA / SA rounded
    # to four places. The engine divides by the unrounded 0.869126 and gets
    # 1.86308, 1.2 units off in the fourth place. That is the billed-rate
    # rounding question still open in handoff.md (item 4), not the transition.

tolerance:
  rates: 0.0001
