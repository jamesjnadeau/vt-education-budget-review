# Addison Central Unified School District, FY2026: an Act 84 transition district.
#
# What the State published: $15,081.88 per weighted pupil (AOE) and a district
# rate of 1.6105 (Tax Department). 32 V.S.A. § 5401(13)(A) alone gives
# 15,081.88 / 8,596 = 1.7545. The difference is the Act 127 tax rate transition,
# 2024 Acts No. 84, Sec. 3, as amended by 2024 Acts No. 183, Sec. 16:
#
#   FY2025 decrease (AOE worksheet, 13 percent relative decrease)     $0.13
#   FY2026 share, Sec. 3(c)(1)                                  x 0.80 = 0.104
#   divided by the FY2026 statewide adjustment 0.7236                  = 0.1437
#   rounded to three places (Tax Department convention, not statute)   = 0.144
#   1.754523 - 0.144                                                   = 1.6105
#
# This fixture was a known disagreement until the transition was read from the
# session law (model/statute/2026-10-22/) and implemented. See
# docs/act-127-transition.md.
#
# Spending and pupils: warehouse/aoe-edspend/fy2026.yaml, district row 51,
# town rows 37-43. CLA and rates: intake/tax-rates/fy2026/FY26EdTaxRates_081825.xlsx.
entity: ud/addison-central-55
