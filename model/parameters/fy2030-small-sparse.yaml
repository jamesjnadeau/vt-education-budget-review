schema_version: "1.0"
fiscal_year: 2030
status: draft

# ---------------------------------------------------------------------------
# Small / sparse school support grants.
#
# Every STATUTORY value here is null with verified: false. Nothing was carried in
# from an AOE summary page, a JFO briefing, or a language model's recollection --
# including the one that drafted this file. The readings found in secondary
# sources live in docs/small-sparse-verification-worksheet.md instead,
# deliberately outside this file, so there is nothing here to promote carelessly.
#
# A DISTINCTION THIS FILE NEEDS AND THE OTHERS DO NOT
#
# There are two kinds of parameter in this layer and they cannot share a
# verification rule:
#
#   is_law: true (the default)   Values fixed in Act 73 Sec. 37 as amended.
#                                Verified only by reading the operative sentence
#                                in current law. All null until then.
#
#   is_law: false                Thresholds PROPOSED by the State Board's special
#                                committee on 2025-12-17. Not law, and may never
#                                be. They carry values because the committee's
#                                own report is the primary source for what the
#                                committee proposed -- quoting it is not the same
#                                act as quoting a statute. The engine labels any
#                                figure measured against them as measured against
#                                a proposed standard, and parse.ts refuses to let
#                                one carry a V.S.A. citation.
#
# Conflating the two would be the verification doc's error in reverse: treating a
# proposal as law rather than a summary as statute.
#
# WHY THE FRAMEWORK VALUES ARE STILL UNVERIFIED
#
# They are quoted from the committee's presentation, which is the right source.
# But that presentation is not yet a hashed intake artifact --
# education.vermont.gov returns 403 to automated clients, so it needs a manual
# save into intake/sbe/2025-12-17-small-sparse-framework/. Under README rule 2
# that distinction is the whole point, so they stay verified: false and the
# engine declines to compute from them. See that directory's README.
#
# THE CITATION OF RECORD IS THE ACT, NOT THE CODIFIED SECTION
#
# These provisions are contingently effective and Vermont Statutes Online may not
# reflect them yet. See docs/parameter-verification.md, sources in order of
# authority, item 2. Where the codified section is genuinely unknown, `statute`
# names the act and says so rather than guessing a section number: a guessed
# section is worse than an admitted gap, because it looks checked.
#
# ONE FILE, NOT TWO
#
# Act 73 attached the grants to foundation formula implementation, originally the
# 2028-29 school year. Act 170 moved implementation to 2029-30. Whether Act 170
# amended the fiscal year references in Sec. 37, or the schedule shifts by
# operation of the contingency, is unread. Do NOT create a parallel fy2029 file
# with the same values -- that is carrying a value forward, which the
# verification checklist prohibits for the yield and prohibits here for the same
# reason. The correct fiscal year is a finding, not a guess to hedge.
#
# NAMING
#
# The framework's phrase is "projected savings from closure". README rule 3 says
# there is no `savings` field in this codebase and there will not be one. Both
# hold: the word appears only inside quoted framework text, rendered as a
# quotation. The engine's field is a signed closure cost delta, presented in both
# directions.
# ---------------------------------------------------------------------------

note: >-
  Small and sparse school support grants under Act 73 of 2025 Sec. 37, as
  possibly amended by Act 170 of 2026, plus the State Board committee's proposed
  necessity framework of 2025-12-17. Every statutory value is null and
  unverified: neither legislature.vermont.gov nor education.vermont.gov was
  reachable from an automated client, and a plausible value from a secondary
  source is exactly what docs/parameter-verification.md exists to keep out of a
  value field. The framework parameters carry values but are marked is_law:
  false and are unverified pending a hashed save of the committee's presentation.
  Nothing in this file can produce a figure, and nothing should until someone
  reads the enacted acts.

