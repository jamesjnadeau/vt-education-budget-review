      mutually_exclusive. A school under the enrollment threshold in a town under
      the density threshold appears to meet both screens. Under the secondary
      readings the spread between additive and greater-of is roughly 60% on the
      line item, concentrated in exactly the schools most exposed in the March
      2028 votes. Until this is read the engine emits separate lines and no
      total. Record the finding in the header of model/src/small-sparse.ts in the
      same commit as the reading.

  # --- Statutory screen 1: enrollment ---------------------------------------

  statutory.screens.small_enrollment.threshold:
    value: null
    unit: students
    description: the enrollment below which a school is small
    applies_to: public schools
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null

  statutory.screens.small_enrollment.comparator:
    value: null
    unit: enum
    description: whether the enrollment test is strictly below the threshold or at or below it
    applies_to: public schools
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Legal values are lt and lte. A school sitting exactly on the threshold
      qualifies under one and not the other, which is not a rounding question:
      Vermont has schools at exactly 100. Read the comparator, then assert it in
      a golden fixture at the boundary.

  statutory.screens.small_enrollment.basis:
    value: null
    unit: enum
    description: the enrollment figure the qualifying test is applied to
    applies_to: public schools
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Legal values are two_year_average and single_year. The secondary sources
      CONFLICT: the AOE summary describes a school that enrolls fewer than 100,
      the JFO briefing a two-year average below 100. Until this is read the basis
      is a scenario input with no default, and the schools whose status differs
      between the two readings are themselves a finding.

  # --- Statutory screen 2: municipal population density ---------------------

  statutory.screens.sparse_density.threshold:
    value: null
    unit: persons_per_square_mile
    description: the population density below which an area is sparsely populated
    applies_to: the municipality a public school building stands in
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null

  statutory.screens.sparse_density.comparator:
    value: null
    unit: enum
    description: whether the density test is strictly below the threshold or at or below it
    applies_to: the municipality a public school building stands in
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null

  statutory.screens.sparse_density.geography:
    value: null
    unit: enum
    description: whose density the sparse test measures
    applies_to: public schools
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      STRUCTURAL, and the single reading most likely to invalidate this layer's
      shape. Legal values are municipality_of_school_location, district_member_towns
      and other. Whether the test looks at the town the school building sits in or
      at the district's member towns changes which schools are candidates, and a
      district-level reading would be wrong for every school in a district
      containing one dense town. If it turns out to be district_member_towns, a
      school-level model is the wrong shape and most of this layer needs
      rebuilding -- so read this phrase before building anything on top of it.

  statutory.screens.sparse_density.area_measure:
    value: null
    unit: enum
    description: whether density is measured against land area or total area
    applies_to: the municipality a public school building stands in
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Legal values are land_area and total_area. The secondary sources say "of
      land". If that is the statutory wording, use Census TIGER ALAND. Total area
      understates density and wrongly pulls lakeside and pond-heavy towns into
      eligibility, so this is a real correctness question and not a pedantic one.
      Verify the exact phrase, then assert it in a golden fixture -- there is one
      in model/goldens/small-sparse/ that fails if anyone swaps the measure.

  statutory.screens.sparse_density.population_series:
    value: null
    unit: enum
    description: which population series the density test uses
    applies_to: the municipality a public school building stands in
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Legal values are decennial, acs_5yr, state_estimate and
      unspecified_in_statute. If the statute names no series, then
      unspecified_in_statute is the correct VERIFIED value and the choice becomes
      a user-visible scenario input with no default rather than an implementation
      detail. Compute both and publish the towns that move between them.

  # --- Who determines necessity, and when -----------------------------------

