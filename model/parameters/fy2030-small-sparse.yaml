  statutory.grants.stacking_rule:
    value: null
    unit: enum
    description: whether a school meeting both screens receives both grants or the greater
    applies_to: public schools meeting both the small and the sparse screen
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      STRUCTURAL, not merely numeric. Legal values are additive, greater_of and
      mutually_exclusive. A school under the enrollment threshold in a town under
      the density threshold appears to meet both screens. Under the secondary
      readings the spread between additive and greater-of is roughly 60% on the
      line item, concentrated in exactly the schools most exposed in the March
      2028 votes. Until this is read the engine emits separate lines and no
      total. Record the finding in the header of model/src/small-sparse.ts in the
      same commit as the reading.

      READ 2026-11-22 against Act 170 Sec. 29: § 4019(b) and (c) are two
      independent payments, each "to each school district for each small school"
      or "each sparse school", and nothing in the section excludes one for a
      school that is also the other. That reads as additive, but silence is not a
      rule and no sentence states it, so the value stays null: there is no
      quotable sentence to verify. Confirm with AOE or the Joint Fiscal Office.

  # --- Statutory screen 1: enrollment ---------------------------------------

  statutory.screens.small_enrollment.threshold:
    value: 12
    unit: students
    description: the average grade size below which a school is small
    applies_to: public schools
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(a)(3)(A)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        “Small school” means a public school that: (A) has an average grade size of
        fewer than 12 students; and (B) has been determined by the Agency of
        Education, on an annual basis, to be “small by necessity” under standards
        consistent with State Board of Education rule.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"

  statutory.screens.small_enrollment.comparator:
    value: lt
    unit: enum
    description: whether the enrollment test is strictly below the threshold or at or below it
    applies_to: public schools
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(a)(3)(A)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        “Small school” means a public school that: (A) has an average grade size of
        fewer than 12 students; and (B) has been determined by the Agency of
        Education, on an annual basis, to be “small by necessity” under standards
        consistent with State Board of Education rule.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"
    structural_note: >-
      Legal values are lt and lte. A school sitting exactly on the threshold
      qualifies under one and not the other, which is not a rounding question:
      Average grade size is a rounded-down integer, so schools do sit exactly on
      the threshold. Read the comparator, then assert it in
      a golden fixture at the boundary.

  statutory.screens.small_enrollment.basis:
    value: two_year_average
    unit: enum
    description: the enrollment figure the qualifying test is applied to
    applies_to: public schools
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(a)(1)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        “Average grade size” means the quotient resulting from dividing a school’s
        two-year average enrollment by the number of grades above prekindergarten
        operated by the school, rounded downward.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"
    structural_note: >-
      Resolved by the act: § 4019(a)(1) defines average grade size from the
      TWO-YEAR AVERAGE enrollment divided by the grades above prekindergarten
      operated by the school, rounded downward. The earlier "fewer than 100"
      reading was Act 73 Sec. 37, which Act 170 Sec. 28 repealed.

  # --- Statutory screen 2: municipal population density ---------------------

  statutory.screens.sparse_density.threshold:
    value: 55
    unit: persons_per_square_mile
    description: the population density below which an area is sparsely populated
    applies_to: the municipality a public school building stands in
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(a)(4)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        “Sparse area” means a city, town, or incorporated village where the number
        of persons per square mile residing within the land area of the geographic
        boundaries of the city, town, or incorporated village as of July 1 of the
        year of determination is fewer than 55 persons.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"

