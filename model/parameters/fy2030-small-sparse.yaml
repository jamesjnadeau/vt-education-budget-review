  framework.open_questions.capital_cost_basis:
    value: null
    unit: enum
    is_law: false
    description: whether receiving-school renovation cost is measured gross or net of construction aid
    applies_to: the feasible consolidation and closure cost criteria
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17 (the framework does not resolve this)"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      HIGH SEVERITY, and the best rulemaking comment available. Act 170 pays up
      to 75% of construction costs for merged districts against 30% otherwise. On
      a NET-of-aid basis, merging shrinks the district's cost of expanding a
      receiving school, makes closure look cheaper, and thereby weakens the case
      that the district's own small schools exist by necessity. On a GROSS basis
      the merger decision does not touch the test. Same school, same numbers,
      opposite answer. Legal values are gross_project_cost and
      net_of_construction_aid; there is no default, the scenario states which it
      used, and the result displays it.

