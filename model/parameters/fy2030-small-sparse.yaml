  statutory.grants.stacking_rule:
    value: null
    unit: enum
    description: whether a school meeting both screens receives both grants or the greater
    applies_to: public schools meeting both the small and the sparse screen
    contingent: true
    citation:
      statute: "2025 Acts and Resolves No. 73, Sec. 37 (codified section unread)"
      session_law: "Act 73 of 2025, Sec. 37"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
