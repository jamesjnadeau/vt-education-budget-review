schema_version: "1.0"
fiscal_year: 2030
status: draft

# ---------------------------------------------------------------------------
# Small / sparse school support grants.
#
# The statutory values here were read from the enacted Act 170 of 2026 (Sec. 29
# adds 16 V.S.A. § 4019; Sec. 28 repeals Act 73 Sec. 37) and carry the verbatim
# operative sentence. Sec. 86 makes Sec. 29 effective July 1, 2029 if the Act 73
# Sec. 70(f)(1) conditions are met (READ 2026-11-22: the General Assembly must
# receive the Sec. 45a foundation formula report and the merger-committee
# facilitator report, and enact legislation addressing, among other things,
# "sparsity measures"; none is confirmed). The one statutory key left null is the stacking rule, because the act states none.
# Secondary readings are in docs/small-sparse-verification-worksheet.md.
#
# A DISTINCTION THIS FILE NEEDS AND THE OTHERS DO NOT
#
# There are two kinds of parameter in this layer and they cannot share a
# verification rule:
#
#   is_law: true (the default)   Values fixed in 16 V.S.A. § 4019 (Act 170 Sec. 29).
#                                Verified only by pasting the operative sentence.
#
#   is_law: false                Thresholds PROPOSED by the State Board's special
#                                committee on 2025-12-17. Not law, and may never
#                                be. They carry values because the committee's
#                                own report is the primary source for what the
#                                committee proposed -- quoting it is not the same
#                                act as quoting a statute. The engine labels any
#                                figure measured against them as measured against
#                                a proposed standard, and parse.ts refuses to let
#                                one carry a V.S.A. citation.
#
# Conflating the two would be the verification doc's error in reverse: treating a
# proposal as law rather than a summary as statute.
#
# WHY THE FRAMEWORK VALUES ARE STILL UNVERIFIED
#
# They are quoted from the committee's presentation, which is the right source.
# But that presentation is not yet a hashed intake artifact --
# education.vermont.gov returns 403 to automated clients, so it needs a manual
# save into intake/sbe/2025-12-17-small-sparse-framework/. Under README rule 2
# that distinction is the whole point, so they stay verified: false and the
# engine declines to compute from them. See that directory's README.
#
# THE CITATION OF RECORD IS THE ACT, NOT THE CODIFIED SECTION
#
# These provisions are contingently effective and Vermont Statutes Online may not
# reflect them yet. See docs/parameter-verification.md, sources in order of
# authority, item 2. Where the codified section is genuinely unknown, `statute`
# names the act and says so rather than guessing a section number: a guessed
# section is worse than an admitted gap, because it looks checked.
#
# ONE FILE, NOT TWO
#
# Act 73 attached the grants to foundation formula implementation, originally the
# 2028-29 school year. Act 170 moved implementation to 2029-30 (Sec. 18 changes the
# Sec. 70(f)(1) date from July 1, 2028 to July 1, 2029). Sec. 37 itself is
# repealed by Act 170 Sec. 28, so the question is moot for the grants; whether
# the 2029 date holds depends on the Sec. 70(f)(1) conditions. Do NOT create a parallel fy2029 file
# with the same values -- that is carrying a value forward, which the
# verification checklist prohibits for the yield and prohibits here for the same
# reason. The correct fiscal year is a finding, not a guess to hedge.
#
# NAMING
#
# The framework's phrase is "projected savings from closure". README rule 3 says
# there is no `savings` field in this codebase and there will not be one. Both
# hold: the word appears only inside quoted framework text, rendered as a
# quotation. The engine's field is a signed closure cost delta, presented in both
# directions.
# ---------------------------------------------------------------------------

note: >-
  Small and sparse school support grants under 16 V.S.A. § 4019 as added by Act
  170 of 2026 Sec. 29 (effective July 1, 2029 if the Act 73 Sec. 70(f)(1)
  conditions are met: receipt of the Sec. 45a foundation formula report and the
  merger facilitator report, plus enacted legislation addressing the report's
  components including "sparsity measures", a pre-K funding mechanism, and
  legacy bargaining agreements and debt; Act 170 Sec. 18), plus the State Board committee's
  proposed necessity framework of 2025-12-17. Statutory values were read from
  the enacted act and carry the verbatim sentence, except the stacking rule,
  which the act does not state. The framework parameters carry values but are
  marked is_law: false.

parameters:
  # --- The grants -----------------------------------------------------------

  statutory.grants.small_school.per_pupil:
    value: 3157
    unit: usd_per_pupil
    description: small school support grant per pupil
    applies_to: public schools determined small by necessity
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(b)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        Annually, the Secretary shall pay a small schools support grant to each
        school district for each small school operated by the school district in an
        amount determined by multiplying the two-year average enrollment in the
        small school by $3,157.00.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"

  statutory.grants.small_school.pupil_count_basis:
    value: two_year_average
    unit: enum
    description: the pupil count the small school grant is paid on
    applies_to: public schools determined small by necessity
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(b), (a)(6)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        Annually, the Secretary shall pay a small schools support grant to each
        school district for each small school operated by the school district in an
        amount determined by multiplying the two-year average enrollment in the
        small school by $3,157.00.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"
    structural_note: >-
      Legal values are two_year_average and single_year. Read against
      statutory.screens.small_enrollment.comparator: if the QUALIFYING test and
      the PAYMENT basis use different enrollment figures, borderline schools
      qualify under one frame and are paid under the other, and the divergence is
      publishable in its own right.
      WHAT "ENROLLMENT" COUNTS (READ 2026-11-22, § 4019(a)(2)): "Enrollment" means
      the number of students in kindergarten through grade 12 who are enrolled in
      a school operated by the school district on October 1. A student shall be
      counted as one whether the student is enrolled as a full-time or part-time
      student. So the input is an October 1 headcount, K-12 only (prekindergarten
      is not counted), with part-time students counted as one, not as an FTE or
      an average daily membership. Both years of the two-year average are October
      1 counts.

  statutory.grants.small_school.inflation_index:
    value: nipa_state_local_government_implicit_price_deflator
    unit: enum
    description: the index by which the small school grant is adjusted annually
    applies_to: public schools determined small by necessity
    contingent: false
    citation:
      statute: "16 V.S.A. § 4019, as added by 2026 Acts and Resolves No. 170, Sec. 29, § 4019(d)"
      session_law: "Act 170 of 2026, Sec. 29"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: >-
        Each dollar amount under subsections (b) and (c) of this section shall be
        adjusted for inflation annually on or before November 15 by the Secretary.
        As used in this subsection, “adjusted for inflation” means adjusting the
        dollar amount by the National Income and Product Accounts (NIPA) implicit
        price deflator for state and local government consumption expenditures and
        gross investment published by the U.S. Department of Commerce, Bureau of
        Economic Analysis, from fiscal year 2025 through the fiscal year for which
        the amount is being determined, and rounding upward to the nearest whole
        dollar amount.
      verified: true
      verified_date: "2026-11-22"
      verified_by: "automated read of the enacted act, intake/vt-legislature/2026-acts/ACT170 As Enacted.pdf (sha256 d3f70eb8…); awaiting human countersignature"
    structural_note: >-
      Read whether the index reaches the SPARSE grant as well. Secondary sources
      describe indexing for one and are silent on the other, which may be an
      artifact of the summary or may be the statute. Read it against the base
      education amount's index too: if they differ, that is itself a finding.

