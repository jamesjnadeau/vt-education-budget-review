    unit: date
    description: the date by which the necessity rules must be adopted
    applies_to: the determining authority
    contingent: true
    citation:
      statute: "2026 Acts and Resolves No. 170 (section numbers unread; see the worksheet)"
      session_law: "Act 170 of 2026"
      source_url: "https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT170/ACT170%20As%20Enacted.pdf"
      quote: null
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Computes nothing, and is still worth reading early: it drives the
      rulemaking comment deadline, and a missed comment window is unrecoverable
      in a way a missed number is not.

  # ==========================================================================
  # PROPOSED, NOT LAW
  #
  # Everything below is is_law: false. It records what the State Board's special
  # committee proposed on 2025-12-17 under the charge in Act 73 Sec. 8. The
  # committee presented all five criteria under the heading "Possible criteria"
  # and proposed no scoring, weighting or ranking -- each criterion reads "A
  # school qualifies if", so they are independent sufficient paths. The engine
  # must not add an aggregate: a composite score would be an editorial judgment
  # wearing a computation's clothes, which README rule 3 forbids.
  # ==========================================================================

  framework.logic:
    value: disjunctive
    unit: enum
    is_law: false
    description: how the five proposed necessity criteria combine
    applies_to: the proposed necessity framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: "A school qualifies if"
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Each criterion is framed this way, so they read as independent sufficient
      paths rather than as a checklist to be scored. Unverified because the
      presentation is not yet a hashed intake artifact.

  framework.organizing_principle:
    value: null
    unit: unset
    is_law: false
    description: the committee's stated organizing principle for necessity
    applies_to: the proposed necessity framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: >-
        By necessity should be a function of unavoidable or demographic
        circumstances, since the criteria for small and sparse are already
        defined in statute. The operative test: a school cannot reasonably
        increase enrollment or consolidate without creating undue hardship for
        students, specifically in terms of travel time, safety, or lack of
        feasible alternatives. Eligible side: "Schools that are small/sparse
        because of geography or isolation". Ineligible side: "Schools that are
        small/sparse due to local organizational decisions, preferences, or
        policy choices".
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Carries no value: it is the framing the criteria hang off, quoted so a
      reader can see the line the committee drew between circumstance and choice.

  framework.criteria.travel_time_or_distance.travel_time_one_way_minutes.elementary:
    value: 45
    unit: minutes
    is_law: false
    description: proposed one-way travel time threshold for elementary pupils
    applies_to: elementary schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: "45 minutes for elementary students"
      verified: false
      verified_date: null
      verified_by: null

  framework.criteria.travel_time_or_distance.travel_time_one_way_minutes.grades_7_12:
    value: 60
    unit: minutes
    is_law: false
    description: proposed one-way travel time threshold for grades 7 through 12
    applies_to: secondary schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: "60 minutes for grades 7–12"
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      The thresholds split at grade 7 and the framework says nothing about a K-8
      or K-12 school, of which Vermont has many. The engine applies the stricter
      elementary threshold to a straddling span and flags it rather than picking
      the one that produces a more convenient answer. This is a rulemaking
      comment.

  framework.criteria.travel_time_or_distance.road_miles_to_nearest_same_grade_span:
    value: null
    unit: miles
    is_law: false
    description: proposed road distance to the nearest school of the same grade span
    applies_to: public schools under the proposed framework
    range:
      low: 10
      high: 15
      central: null
      basis: >-
        terrain, which the framework leaves undefined. Quoted: "Road miles to the
        nearest school of the same grade span exceed 10–15 miles, depending on
        terrain."
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: "Road miles to the nearest school of the same grade span exceed 10–15 miles, depending on terrain."
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      A range with an undefined basis, and it keeps a range rather than becoming
      a point value, exactly as the verification checklist prescribes for the JFO
      ranges. The engine reports against both ends and returns indeterminate in
      between; picking 12.5 would invent the terrain rule the committee declined
      to write.

  framework.criteria.safe_transportation:
    value: null
    unit: unset
    is_law: false
    description: proposed criterion, unsafe or unreliable transportation
    applies_to: public schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: >-
        Terrain, winter road conditions, unpaved routes, or mountain gaps create
        unsafe or unreliable transportation, as certified by the supervisory
        union or AOE. Examples given: "Bus routes requiring travel over roads
        closed in winter"; "Mountain passes that cause 60+ minute detours"; "Only
        one road in/out of town (\"single ingress\") prone to closures".
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Terminal: not computable from public data, and correctly so. Single ingress
      is arguably detectable from a road network, but detecting a candidate is
      not certifying a condition, and publishing the former as the latter would
      substitute our judgment for the supervisory union's.

  framework.criteria.feasible_consolidation:
    value: null
    unit: unset
    is_law: false
    description: proposed criterion, no feasible consolidation
    applies_to: public schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: >-
        "Nearby schools – both within and outside the existing district boundary
        - lack capacity to absorb students and still meet the State's Educational
        Quality Standards, including class size minimums"; "Costs of renovation
        or addition at receiving schools exceed projected savings from closure";
        "Tuitioning out raises per-pupil costs or creates inequities in program
        access, especially students with disabilities who require special
        education services and other students whose learning needs cannot be met
        by nearby non-public schools".
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Requires a local model: building capacity and project estimates are local
      and not published statewide. The second limb also depends on
      framework.open_questions.capital_cost_basis, which the framework does not
      resolve.

  framework.criteria.population_trajectory:
    value: null
    unit: unset
    is_law: false
    description: proposed criterion, projected enrollment stays below viability
    applies_to: public schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: >-
        The census block or town catchment area is projected to remain below an
        enrollment that would support a viable larger school, even with
        consolidation. Rationale given: "Provides flexibility in places where
        schools may temporarily fall below 100 students."
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      CONSEQUENCE FOR THE UI. This criterion decouples eligibility from current
      headcount: a school above the enrollment threshold today is not thereby
      excluded. The enrollment screen is therefore a candidate filter and not a
      gate, and the site must not present it as one. "Viable larger school" is
      undefined. Requires a projection.

  framework.criteria.closure_cost_increase:
    value: null
    unit: unset
    is_law: false
    description: proposed criterion, closure raises per-student cost
    applies_to: public schools under the proposed framework
    citation:
      statute: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to the Vermont State Board of Education, 2025-12-17"
      session_law: null
      source_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
      quote: >-
        A school qualifies if closure or consolidation would create substantial,
        measurable increases the district's average per student expenditure.
        Limbs: "Tuitioning Costs: Reassigning students to non-public tuition
        schools would lead to significantly higher per-pupil expenditures than
        continuing to operate the school."; "Transportation Costs: Consolidation
        would require additional buses, longer routes, more driver hours, or
        substantial new operational transportation expenses, resulting in a
        sustained increase in district transportation costs."; "Capital Costs at
        Receiving Schools: Accommodating reassigned students would necessitate
        major renovations, additions, safety upgrades, or new classrooms, and
        these capital expenses would exceed any projected savings from closure.";
        "New Facility Requirements: Closure would require new school construction
        or major facility expansions elsewhere in the school's existing district
        or nearby district where students would be reassigned, imposing a
        material tax burden on the community."
      verified: false
      verified_date: null
      verified_by: null
    structural_note: >-
      Requires a local model. The quoted limbs contain the phrase "projected
      savings from closure"; the word appears in this repository only inside that
      quotation. The engine's field is a signed closure cost delta presented in
      both directions, per README rule 3.

