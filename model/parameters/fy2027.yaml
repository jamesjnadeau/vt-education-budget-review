      verified: true
      verified_date: "2026-07-29"
      verified_by: "automated retrieval from legislature.vermont.gov; snapshot in model/statute/2026-07-29/32-vsa-5401.txt; awaiting human countersignature"

  tax.excess_spending_capital_reserve_multiplier:
