      verified: true
      verified_date: "2026-07-29"
      verified_by: "automated retrieval from legislature.vermont.gov; snapshot in model/statute/2026-07-29/16-vsa-4010.txt; awaiting human countersignature"

  # --- Sparsity (low population density) ------------------------------------
