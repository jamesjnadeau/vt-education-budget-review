schema_version: "1.0"
fiscal_year: 2027
status: draft

# ---------------------------------------------------------------------------
# READ THIS BEFORE USING ANY NUMBER FROM THIS FILE.
#
# Every parameter below has value: null and citation.verified: false.
# That is deliberate and it is the correct state for this file today.
#
# The statute references are LEADS TO CHECK, not established facts. They record
# where the relevant law is believed to live so that verification has somewhere
# to start. They were not confirmed against current statute text, because the
# authoritative sources could not be reached from the environment this file was
# drafted in:
#
#   legislature.vermont.gov   TLS certificate chain could not be verified
#   education.vermont.gov     HTTP 403 to automated clients
#
# Filling these in from memory or from a secondary mirror and marking them
# verified is precisely the failure this project exists to be the opposite of.
# 16 V.S.A. ch. 133 has been amended in most recent sessions -- Act 127 of 2022,
# Act 73 of 2025 -- and a remembered weight is very likely to be a repealed one.
#
# Nothing here can leak into a published figure while it stays this way. The
# engine refuses to compute from an unverified parameter: it returns null and
# marks the computation node `unverified`, and the site renders that state
# explicitly. The tests in model/src/engine.test.ts assert this.
#
# To verify: follow docs/parameter-verification.md, which lists each parameter,
# the source to read, and what to record.
# ---------------------------------------------------------------------------

note: >-
