    unit: multiplier
    description: share of capital reserve fund draws more than five years old counted toward the excess spending comparison
    applies_to: districts drawing on capital reserve funds more than five years old
    structural_note: >-
      Act 183 of 2024 adds this to the spending side of the excess spending test,
      alongside an exclusion for principal and interest on bonds approved before
      July 1, 2024 (16 V.S.A. § 4001(6)(B)). Both shape the excess spending
      calculation, not just a number; see docs/excess-spending-threshold.md and
      excessSpending in model/src/tax.ts.
    citation:
      statute: "32 V.S.A. § 5401(12)"
      session_law: "Act 183 of 2024"
      source_url: "https://education.vermont.gov/data-and-reporting/financial-reports/excess-spending-threshold"
      quote: >-
        Agency of Education, Excess Spending Threshold Summary and Tax Rate Impact
        (issued August 19, 2024): district per pupil spending includes "150% of
        capital reserve funds more than 5-years old that were previously excluded
        from excess spending per 24 V.S.A. § 2804 (b)."
      verified: false
      verified_date: null
      verified_by: null

  tax.income_percentage_target:
