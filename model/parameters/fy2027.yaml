  # --- Foundation formula (contingent) --------------------------------------
  # Act 73 of 2025 sets a course toward a base-amount formula with a statewide
  # rate, contingently effective for the 2028-29 reorganization. The Legislature
  # has not set these values. They are marked contingent and carry no range:
  # a range with no defensible basis would be a guess in the costume of an
  # estimate. When the JFO consultant recommendations land, they become a range
  # with a real basis and this file gains a successor.

  foundation.base_amount:
    value: null
    unit: usd_per_pupil
    description: base amount per weighted pupil under the foundation formula
    applies_to: all districts, once effective
    contingent: true
    citation:
      statute: "16 V.S.A. § 4011 (as affected by Act 73 of 2025)"
      session_law: "2025 Acts and Resolves No. 73"
      source_url: "https://legislature.vermont.gov/bill/status/2026/H.454"
