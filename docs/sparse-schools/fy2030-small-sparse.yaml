# Small / sparse school support grants — parameter set
#
# Follows docs/parameter-verification.md. Every STATUTORY value here is `null` with
# `verified: false`. No value was carried in from an AOE summary page, a JFO briefing, or
# a language model's recollection — including the one that drafted this file. The
# readings I found in secondary sources are recorded in
# docs/small-sparse-verification-worksheet.md instead, deliberately outside this file,
# so there is nothing here to carelessly promote.
#
# ---------------------------------------------------------------------------
# A distinction this parameter set needs and the existing files do not
# ---------------------------------------------------------------------------
# There are two kinds of parameter in this layer and they cannot share a verification
# rule:
#
#   `statutory:`  Values fixed in Act 73 Sec. 37 as amended. Verified only by reading
#                 the operative sentence in current law. All null until then.
#
#   `framework:`  Thresholds PROPOSED by the State Board's special committee on
#                 2025-12-17. These are not law and may never be. They carry values,
#                 because the committee report is itself the primary source for what the
#                 committee proposed — quoting it is not the same act as quoting a
#                 statute. Every entry is `is_law: false`, and the engine must label any
#                 figure derived from them as measured against a proposed standard.
#
# Conflating these would be the specific error the verification doc warns about, in
# reverse: treating a proposal as law rather than treating a summary as statute.

parameter_set: small-sparse
fiscal_year: 2030
status: unverified
schema_version: 1.0
drafted: 2026-07-30
drafted_by: claude

contingency:
  contingent: true
  note: >
    The support grants take effect with the foundation formula, which Act 170 of 2026
    made contingent on further legislative action. Renderers must carry the contingency
    label wherever these figures appear, separately from verification status. Contingent
    and unverified are different conditions and a figure can be both.

fiscal_year_reference:
  resolved: false
  question: >
    Act 73 attached the grants to foundation formula implementation, originally the
    2028-29 school year. Act 170 moved implementation to 2029-30. Whether Act 170
    amended the fiscal year references in Sec. 37 or the schedule shifts by operation of
    the contingency is unread.
  handling: >
    One file only, this one, pending the reading. Do NOT create a parallel fy2029 file
    with the same values — that is carrying a value forward, which the verification
    checklist prohibits for the yield and prohibits here for the same reason. The
    correct fiscal year is a finding, not a guess to hedge.

