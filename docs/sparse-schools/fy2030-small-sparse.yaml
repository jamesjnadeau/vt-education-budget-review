# ---------------------------------------------------------------------------
# Framework parameters — proposed, not law
# ---------------------------------------------------------------------------
# Values present. Source is the committee's own report, which is the primary source for
# what the committee proposed. Every entry is is_law: false and the engine must never
# present a result measured against these as a legal determination.

framework:
  source:
    document_title: "Framework for Considering Small/Sparse Schools That Operate by Necessity — Committee Report to Vermont State Board of Education"
    date: 2025-12-17
    landing_url: "https://education.vermont.gov/document/sbe-agenda-item-j-2-12-17-2025"
    artifact_url: "https://education.vermont.gov/sites/aoe/files/documents/SBE%20Small%20Sparse%20presentation.pdf"
    retrieved: 2026-07-30
    retrieved_by: claude
    intake_ref: "intake/sbe/2025-12-17-small-sparse-framework/"
    sha256: null
    note: >
      Fetch the artifact and record it in intake with a hash before relying on it.
      education.vermont.gov returns 403 to automated clients, so this is a manual save.
      The reading below came from a copy supplied in conversation, which is not the same
      as a hashed intake artifact.
    legislative_charge: "Act 73 of 2025, Sec. 8"
    committee: ["Tammy Kolbe (chair)", "Cynthia Stuart", "Brian Campion"]
    adoption_status: proposed_not_adopted
    heading_verbatim: "Possible criteria"

  logic:
    value: disjunctive
    is_law: false
    quote: "A school qualifies if"
    note: >
      Each criterion slide is framed this way, so the criteria read as independent
      sufficient paths. The framework proposes no scoring, weighting or ranking. The
      engine must not add one — a composite score would be an editorial judgment
      presented as a computation, which README rule 3 forbids.

  organizing_principle:
    is_law: false
    quote: >
      By necessity should be a function of unavoidable or demographic circumstances,
      since the criteria for small and sparse are already defined in statute.
    operative_test_quote: >
      a school cannot reasonably increase enrollment or consolidate without creating
      undue hardship for students, specifically in terms of travel time, safety, or lack
      of feasible alternatives
    eligible_side_quote: "Schools that are small/sparse because of geography or isolation"
    ineligible_side_quote: "Schools that are small/sparse due to local organizational decisions, preferences, or policy choices"

  criteria.travel_time_or_distance:
    is_law: false
    computability: partly_computable
    travel_time_one_way_minutes:
      elementary:
        value: 45
        quote: "45 minutes for elementary students"
      grades_7_12:
        value: 60
        quote: "60 minutes for grades 7–12"
    road_miles_to_nearest_same_grade_span:
      range:
        low: 10
        high: 15
      basis: terrain
      basis_defined: false
      quote: "Road miles to the nearest school of the same grade span exceed 10–15 miles, depending on terrain."
      note: >
        A range with an undefined basis. Per the verification checklist's treatment of
        JFO ranges, this is a `range` block and not a point value; the engine reports
        against both ends and returns indeterminate in between rather than picking 12.5.
    grade_span_straddling:
      resolved: false
      note: >
        The thresholds split at grade 7 and the framework says nothing about a K-8 or
        K-12 school, of which Vermont has many. The engine applies the stricter
        elementary threshold and flags. This is a rulemaking comment.

  criteria.safe_transportation:
    is_law: false
    computability: requires_certification
    certifying_authority: ["supervisory_union", "AOE"]
    quote: >
      Terrain, winter road conditions, unpaved routes, or mountain gaps create unsafe or
      unreliable transportation, as certified by the supervisory union or AOE.
    examples_quoted:
      - "Bus routes requiring travel over roads closed in winter"
      - "Mountain passes that cause 60+ minute detours"
      - "Only one road in/out of town (\"single ingress\") prone to closures"
    note: >
      Terminal status. Single ingress is arguably detectable from a road network, but
      detecting a candidate is not certifying a condition, and publishing the former as
      the latter would substitute our judgment for the SU's.

  criteria.feasible_consolidation:
    is_law: false
    computability: requires_local_model
    limbs_quoted:
      - "Nearby schools – both within and outside the existing district boundary - lack capacity to absorb students and still meet the State's Educational Quality Standards, including class size minimums"
      - "Costs of renovation or addition at receiving schools exceed projected savings from closure"
      - "Tuitioning out raises per-pupil costs or creates inequities in program access, especially students with disabilities who require special education services and other students whose learning needs cannot be met by nearby non-public schools"
    capital_cost_basis:
      value: null
      resolved: false
      options: [gross_project_cost, net_of_construction_aid]
      note: See open_questions.capital_cost_basis.

  criteria.population_trajectory:
    is_law: false
    computability: requires_projection
    quote: >
      The census block or town catchment area is projected to remain below an enrollment
      that would support a viable larger school, even with consolidation.
    rationale_quote: >
      Provides flexibility in places where schools may temporarily fall below 100
      students.
    note: >
      CONSEQUENCE FOR THE UI. This criterion decouples eligibility from current
      headcount. A school above the enrollment threshold today is not thereby excluded.
      The enrollment screen is a candidate filter, not a gate, and the site must not
      present it as one. "Viable larger school" is undefined.

  criteria.closure_cost_increase:
    is_law: false
    computability: requires_local_model
    quote: >
      A school qualifies if closure or consolidation would create substantial,
      measurable increases the district's average per student expenditure
    limbs_quoted:
      - "Tuitioning Costs: Reassigning students to non-public tuition schools would lead to significantly higher per-pupil expenditures than continuing to operate the school."
      - "Transportation Costs: Consolidation would require additional buses, longer routes, more driver hours, or substantial new operational transportation expenses, resulting in a sustained increase in district transportation costs."
      - "Capital Costs at Receiving Schools: Accommodating reassigned students would necessitate major renovations, additions, safety upgrades, or new classrooms, and these capital expenses would exceed any projected savings from closure."
      - "New Facility Requirements: Closure would require new school construction or major facility expansions elsewhere in the school's existing district or nearby district where students would be reassigned, imposing a material tax burden on the community."
    capital_cost_basis:
      value: null
      resolved: false
      options: [gross_project_cost, net_of_construction_aid]
    naming_note: >
      The framework says "projected savings from closure". README rule 3 says there is no
      `savings` field in the codebase and there will not be one. Both hold: the word
      appears here only inside a quoted limb. The engine field is a signed
      `closure_cost_delta`, presented in both directions, and the quoted text is rendered
      as a quotation.

  determination_process:
    is_law: false
    determining_authority_recommended: AOE
    frequency_recommended: annual
    timing_quote: >
      schools be designated as small/sparse by necessity annually, on a timeline that
      aligns with district budgeting and annual town meeting decisions
    rules_vehicle_recommended: "Education Quality Standards"
    current_state: >
      No rules exist and no determinations have been published. determination_status is
      "undetermined" for every school in Vermont as of this file's drafted date.

# ---------------------------------------------------------------------------
# Scenario inputs with no defaults
# ---------------------------------------------------------------------------
# Consistent with the existing convention that consolidation assumptions default to no
# reduction: where a choice drives the answer, the user makes it and sees it.

scenario_inputs:
  capital_cost_basis:
    options: [gross_project_cost, net_of_construction_aid]
    default: null
    required: true
  enrollment_basis:
    options: [two_year_average, single_year]
    default: null
    required: true
  population_series:
    options: [decennial, acs_5yr]
    default: null
    required: true
  eligibility_assumption:
    options: [none, agency_determination, explicit_user_assumption]
    default: none
    note: >
      This one DOES default, to the conservative value. `none` suppresses every dollar
      figure. A user may assert an assumption; the tool may not assert one for them.

# ---------------------------------------------------------------------------
# Open questions
# ---------------------------------------------------------------------------

open_questions:
  capital_cost_basis:
    severity: high
    question: >
      Do "costs of renovation or addition at receiving schools" mean gross project cost
      or the district's net share after Act 170 school construction aid?
    why_it_matters: >
      Merging raises construction aid materially. On a NET basis, merging shrinks the
      district's cost of expanding a receiving school, makes the closure look cheaper,
      and weakens the case that the district's own small schools exist by necessity. On a
      GROSS basis the merger decision does not touch the test. Same school, same numbers,
      opposite answer.
    action: >
      Rulemaking comment. Public, technical, on the record, and requiring no position on
      whether any district should merge. Business plan §10.

  grant_stacking:
    severity: high
    action: "Read Sec. 37 as currently in force. No combined total until then."

  enrollment_test_basis:
    severity: medium
    action: "Read statute. Publish the schools whose status differs between the two readings."

  population_series:
    severity: medium
    action: "Read statute; if unspecified, it becomes a scenario input, not a default."

  inflation_index:
    severity: medium
    action: "Read statute; check whether it reaches the sparse grant."

  grade_span_straddling:
    severity: medium
    action: "Elementary threshold plus flag. Rulemaking comment."

  fiscal_year_references:
    severity: medium
    action: "Read enacted Act 170 and the current Sec. 37."

  act_170_section_numbers:
    severity: low
    action: >
      Every Act 170 section number in the worksheet came from a fiscal note written
      against the House version of H.955. Confirm against the enacted act before citing
      any of them in a deliverable.
