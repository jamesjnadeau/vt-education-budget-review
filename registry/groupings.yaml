# the act PDF. Every `verified` is false and the file `status` stays `draft`.
#
# Mapping convention: a single-town "X School District" maps to `town/x`. The
# registry has only one `sd/` record; every surviving town school district is
# carried as a `town/` entity, and `operated_by` pointing at a union district
# means the town is a member for some grades, not that its district is gone.
# See [[adm-import-town-to-district-mapping]].
#
# Items flagged in `note` / `unmapped_members` need a human eye before verify:
#   - Group 6:  "West River Modified Union Education District" -> registry
