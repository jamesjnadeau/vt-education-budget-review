#               mapped to town/strafford (Strafford). Confirm the act spelling.
#   - Group 10: "Waits River Valley Union School District 36" -> registry
#               "Waits River Union High District #36" (same #36).
#   - Group 12: "Jay"/"Westfield" mapped to town/jay + town/westfield; a joint
#               sd/jay-westfield-joint-elementary also exists.
#   - Group 15: "Lamoille North Modified Unified Union" -> registry splits into
#               #058A and #058B; both mapped, confirm which apply.
# ---------------------------------------------------------------------------
