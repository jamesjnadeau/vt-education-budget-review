# ---------------------------------------------------------------------------
# WHAT HAS HAPPENED TO THESE GROUPINGS SINCE THE ACT PASSED
#
# Act 170 lets the merger-study facilitators change the act's groupings. On
# 2026-09-18 they did: the Vermont Learning Collaborative put the state's 119
# districts into 18 committees rather than the act's 20, after 13 districts
# asked to be moved. Groups 6 and 16 were left below the ~2,000-student floor by
# those moves and were dissolved; their districts went to other committees.
# The facilitators kept the act's numbers for the 18 that remain.
#
# The full list is in `committees` below, transcribed from the VLC's own press
# release (intake/vlc-act170/). Two things to know about it:
#
#   - It is the PRELIMINARY list. Boards could comment through 2026-09-23 and
#     the facilitators aimed to finalize on 2026-09-25. We have not seen a
#     final list or a report that one was issued, so `status` stays
#     `announced_provisional`. When a final list is found, land it in intake/
#     the same way, update `committees`, and set `status: final`.
#   - Every committee is `verified: false`. The roster was transcribed by
#     script from the PDF's text layer and spot-checked against its totals, not
#     read line by line by a person. Set `verified: true` per committee once
#     someone has.
#
# `known_changes` predates the list: it holds the two moves we had pieced
# together from reporting before the list was obtained. Both are now confirmed
# by the list itself, and they are kept for their sourcing history.
# ---------------------------------------------------------------------------
reassignment:
  by: "Vermont Learning Collaborative"
  status: announced_provisional
  as_of: 2026-09-18
  committee_count: 18
  district_count: 119
  requests_granted: 13
  comment_deadline: 2026-09-23
  finalize_target: 2026-09-25
  first_meeting_deadline: 2026-10-15
  roster_published: true
  additional_adjustments: true
  note: >-
    Announced as a starting point, not a final decision: school board leaders
    could comment through 2026-09-23, with the groups to be settled on
    2026-09-25. Committees must hold a first meeting by 2026-10-15 and report
    recommendations by September 2027; any merger goes to voters on Town Meeting
    Day 2028. The full committee list below is from the Vermont Learning
    Collaborative's own press release of 2026-09-18 (intake/vlc-act170/). It
    is the preliminary list. As of 2026-11-22 we have seen no final list and no
    report that the groups were in fact settled on 2026-09-25, so `status`
    stays provisional.
  sources:
    - publisher: "Vermont Learning Collaborative"
      title: "Vermont Learning Collaborative Shares Preliminary Act 170 Merger Committee Groupings"
      url: https://www.chestertelegraph.org/wp-content/uploads/2026/09/New-Groupings-as-of-9-18-26.pdf
      published_date: 2026-09-18
      retrieved_date: 2026-11-22
      retrieved_by: "automated fetch by a Claude subagent; not read by a person"
      quote: >-
        "These groupings reflect a starting point, not a final decision."
      note: >-
        The facilitators' own press release, with the committee-by-committee
        list and each district's two-year average ADM. Hosted by The Chester
        Telegraph, not by the VLC; the copy and its checksum are in
        intake/vlc-act170/. The authority for `committees` and for
        `roster_published: true`.
    - publisher: VTDigger
      title: "School districts assigned to new merger discussion groups"
      url: https://vtdigger.org/2026/09/18/school-districts-assigned-to-new-merger-discussion-groups/
      published_date: 2026-09-18
      retrieved_date: 2026-09-19
      retrieved_by: "automated fetch; not read by a person"
      quote: >-
        Harwood Union Unified School District "requested a committee
        reassignment because it was originally grouped with schools in the Barre
        and Montpelier area"; "instead, the district was more interested in
        merger conversations with Mount Mansfield Unified Union School
        District."
      note: >-
        Reporting on a Vermont Learning Collaborative press release, not the
        release itself. It gives the counts (119 districts, 18 committees, 13
        reassignment requests granted) and this one district by name. It does
        not print the committee rosters, and lead facilitator Dave Younce
        declined to name the 13 districts that asked to move.
    - publisher: Downs Rachlin Martin
      title: "Vermont School Consolidation: Progress Update 09.14.2026"
      url: https://www.drm.com/articles/vermont-school-consolidation-progress-update-09-14-2026/
      published_date: 2026-09-14
      retrieved_date: 2026-09-27
      retrieved_by: "automated fetch; not read by a person"
      quote: >-
        Harwood "voted unanimously on September 9 to ask to leave its assigned
        Central Vermont merger group and instead study merger with Champlain
        Valley and Mount Mansfield." Windham School District asked "to leave its
        assigned merger group and instead join the group containing
        Londonderry." Younce "had already received 11 requests."
      note: >-
        A law firm's client newsletter, written four days BEFORE the new
        groups were announced. It records what districts asked for, not what
        they got; read it with the 09.21 update below, which says every request
        was granted. It also says Readsboro was pursuing "a grouping that
        preserves high-school choice" without naming a destination, so
        Readsboro is not recorded as a move.
    - publisher: Downs Rachlin Martin
      title: "Vermont School Consolidation: Progress Update 09.21.2026"
      url: https://www.drm.com/articles/vermont-school-consolidation-progress-update-09-21-2026/
      published_date: 2026-09-21
      retrieved_date: 2026-09-27
      retrieved_by: "automated fetch; not read by a person"
      quote: >-
        "Thirteen districts requested reassignment, and the facilitators
        granted those requests while also making additional adjustments needed
        to keep groups at or near Act 170's approximately 2,000-student
        threshold." On Harwood: "The revised assignments accommodate that
        request."
      note: >-
        The authority for `additional_adjustments: true`. The thirteen are not
        the whole change: the facilitators also moved districts nobody asked to
        move, and no source says how many or which. So `requests_granted` minus
        `known_changes` is a floor on what we cannot see, not a count.
        Also reports that Act 170 requires committee representation
        proportional to enrollment without saying how, with two models in play
        (several members per district by enrollment, or one member per district
        with enrollment-weighted votes).
