    - district: ud/harwood-60
      district_name_as_written: "Harwood Union Unified School District"
      from_grouping: 20
      to_grouping: 13
      to_grouping_as_reported: "with Mount Mansfield and Champlain Valley"
      to_grouping_basis: published
      verified: false
      note: >-
        First pieced together from reporting: VTDigger said Harwood goes in
        with Mount Mansfield UUSD, and Downs Rachlin Martin said it asked to
        study merger with Champlain Valley and Mount Mansfield. The VLC's own
        list (2026-09-18) now confirms it: Group Thirteen is Champlain Valley,
        Harwood and Mount Mansfield.
    - district: town/windham
      district_name_as_written: "Windham School District"
      from_grouping: 6
      to_grouping: 3
      to_grouping_as_reported: "with the group that includes Londonderry"
      to_grouping_basis: published
      verified: false
      note: >-
        First pieced together from a law firm's newsletter: DRM reported
        Windham's request to join "the group that includes Londonderry"
        (Londonderry is a member town of Taconic and Green, act group 3). The
        VLC's own list (2026-09-18) now confirms it: Windham is in Group Three
        with Taconic and Green.

