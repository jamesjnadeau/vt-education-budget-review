# ---------------------------------------------------------------------------
# The Act 170 statutory district groupings, and what the facilitators have
# done to them since.
#
# Two lists live here, kept apart on purpose:
#
#   `groupings`              The twenty groups as the act prints them,
#                            transcribed and verified against the enacted PDF.
#                            This is the law and does not change when a
#                            facilitator moves a district.
#   `reassignment.committees` The merger study committees as the Vermont
#                            Learning Collaborative published them -- the
#                            groups districts are actually meeting in.
#
# Which districts moved is read off by comparing the two. It is not written
# down a third time.
#
# Mapping convention (both lists): a single-town "X School District" maps to
# `town/x`. The registry has only one `sd/` record; every surviving town school
# district is carried as a `town/` entity, and `operated_by` pointing at a union
# district means the town is a member for some grades, not that its district is
# gone. See [[adm-import-town-to-district-mapping]]. A modified union district
# the source writes once (West River, Lamoille North) maps to both of its
# registry records, A and B.
#
# `npm run validate` checks every slug here against the registry, so a typo in a
# district name fails CI rather than producing an empty scenario on the site.
# ---------------------------------------------------------------------------

act:
  name: "Act 170 of 2026"
  section_reference: "district groupings, reported to be at approximately page 43"
