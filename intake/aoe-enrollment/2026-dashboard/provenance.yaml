    note: >-
      AOE's "Vermont Education Dashboard: Enrollment 2004-2026" (data.vermont.gov 3y6q-qqc7),
      the dataset behind https://education.vermont.gov/accountability-data/vermont-education-dashboard/ved-enrollment
      ("Download the complete dataset"). 20,449 rows: one per school per collection per year, with
      pre-school, full-time and part-time kindergarten, grades 1-12 and adult columns. Two
      collections per year, DC#06_FALL_ADM_Official and DC#04_YearEndCollection_Official, whose
      counts differ. The dataset carries no description of its count date. James Nadeau, who has
      calculated this count, confirmed on 2026-11-22 that DC#06_FALL_ADM_Official is the October 1
      headcount in 16 V.S.A. § 4019(a)(2); the year-end collection is not used (see
      warehouse/small-sparse/gaps.yaml). Dashboard page says version 6, updated 2023-08-23.
