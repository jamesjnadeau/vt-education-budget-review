    note: >-
      The suppression query sent to AOE with the 2026-09-11 request, kept beside
      the extract because the delivered disclosure codes follow its rule
      numbering (rule 1 reporting floor, rule 2 primary small cell, rule 3
      complement, rule 4 single-survivor pair) with min_n = 11. AOE applied it
      at town grain rather than the LEA grain it was written for, and did not
      honour the NULL it asked for on not-collected ELL (SY24 carries zeros
      with a not_collected code instead). This is the method citation for the
      warehouse records, not a source of data.
