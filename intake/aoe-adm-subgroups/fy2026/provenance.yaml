    note: >-
      Records-request extract prepared by the Agency of Education (Anika Miner)
      and delivered by email in answer to James Nadeau's 2026-09-11 request, so
      there is no public URL. Average Daily Membership summed by town of
      residence (ADMTDIST) for SY24, SY25 and SY26 (count years 2023-24,
      2024-25 and 2025-26), in the four Act 127 grade bands (PreK, K-5, 6-8,
      9-12) plus English learners (ELL) and free-or-reduced-lunch eligible
      (NSLELG), with per-row disclosure codes and a count of suppressed bands.
      Two sheets: "Information Sheet" (AOE's explanatory notes) and
      "ADM_Sums_by_ADMTDIST_Across_Yea" (the data). The request asked for an
      adm_total column and supervisory-union grain; neither was delivered, so
      no row total is available to bound suppressed cells against. The SY24 ELL
      column is marked not_collected on every row, and the ten published SY24
      NSLELG values are within two percent of the band-sum total, which is the
      ADMFPSTAT defect AOE described; SY24 ELL and NSLELG are therefore not
      imported. SY26 figures are preliminary (counts divided by 220 days of
      a still-running year, visible in the value denominators) and may change.
