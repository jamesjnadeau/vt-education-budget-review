    note: >-
      34-slide presentation for the FY27 budget informational meeting held the
      day before the March 3, 2026 vote. Slide 30 ("Estimated Residential Tax
      Impact") is the district's own FY26-vs-FY27 build-up of total budget,
      non-tax revenues, education spending, LTW ADM (1,909.88), per-LTW-ADM
      spending and the Montpelier / Roxbury town rates with CLA; slide 31 is the
      non-residential rate (an image of a spreadsheet). The district publishes no
      annual report and no AOE "Three Prior Years Comparisons" form on its own
      site; this deck is the closest district-published equivalent. Text layer
      present; slide 25 is a photo montage. Internal PDF title is the file name,
      creator "Google" (exported from Google Slides). Saved under the filename
      the server sent (Content-Disposition), byte-for-byte as downloaded. The
      published_date is the meeting date printed on slide 1, not a posting date.
