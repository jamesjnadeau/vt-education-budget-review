    note: >-
      "Small Class Size Committee: Charge and Work Ahead", Sarah Buxton,
      General Counsel to the State Board of Education, presented to the Board's
      Small Class Size Committee on 2026-06-01. Covers implementation of the
      class size minimums under Act 73 of 2025 as amended by Act 170 of 2026
      (H.955): the 16 V.S.A. 11(a)(36)-(43) definitions and their prospective
      repeal, the pause on the three-consecutive-year noncompliance clock, Rule
      2000 and Rule 2200 rulemaking, and the committee timeline to rules
      effective July 2027. A summary of enacted law by counsel, not law itself;
      every legal claim it makes is cited to the acts in
      docs/act-73-class-size-minimums.md. Downloaded by hand because
      education.vermont.gov returns HTTP 403 to every non-browser client.
