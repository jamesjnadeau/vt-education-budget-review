    note: >-
      2024 Acts and Resolves No. 183 (H.887 of 2024), as enacted by veto
      override. Sec. 16 amends Act 84 Sec. 3(c) so the decrease is divided by
      the statewide adjustment; Sec. 25(b) makes that amendment effective
      July 1, 2025, i.e. from FY2026. Sec. 17 adds Act 84 Sec. 3(g) on mergers,
      withdrawals and dissolutions. The .txt beside it is pdftotext output.
