      2024 Acts and Resolves No. 84 (H.850 of 2024), as enacted. Sec. 3 is the
      Act 127 tax rate transition for fiscal years 2025-2029: a homestead rate
      decrease of $0.01 per relative percent decrease in a district's share of
      long-term weighted membership, phased out over FY2026-FY2029, floored at
      $1.00. The .txt beside it is pdftotext output, kept for grepping; the PDF
      is the record. Verbatim excerpts in model/statute/2026-10-22/.
