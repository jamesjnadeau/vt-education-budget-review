    note: >-
      Vermont Department of Taxes, "FY2026 Education Property Tax Rates", the
      document page https://tax.vermont.gov/document/fy2026-education-property-tax-rates
      dated Monday, August 18, 2025. One sheet, "August 18", 260 town rows. Columns:
      School Code, Town, CLA, SA, CLA ÷ SA, 2025 Reappraisal, District Rate,
      Homestead Rate, State Rate, Nonhomestead Rate. "District Rate" is the
      equalized homestead rate before the CLA step; "Homestead Rate" and
      "Nonhomestead Rate" are the rates billed, per $100 of assessed value. SA
      (the statewide adjustment, 32 V.S.A. § 5401(17)) is 0.7236 on every row;
      State Rate (the nonhomestead rate before the CLA step) is 1.703 on every
      row. Footnotes on the sheet: rates are per $100 of assessed value; "A"
      marks pending reappraisal results; "B" marks missing education spending
      data. Every published Homestead Rate equals District Rate divided by the
      CLA ÷ SA column as printed (rounded to four places) -- dividing by the
      unrounded quotient reproduces only 150 of 260 rows to the fourth place.
      This is the CLA source for the FY2026 golden fixtures in model/goldens/ and
      the published source for tax.statewide_adjustment in
      model/parameters/fy2026.yaml.
