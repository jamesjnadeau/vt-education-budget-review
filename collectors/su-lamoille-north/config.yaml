  notes: >-
    Replaces the stale lnsu.cloudaccess.net source (old SU domain; no longer
    resolves). The SU's current site is lnsd.org (Finalsite). Two budget-setting
    districts: Lamoille North Modified Unified Union School District #058A
    (PreK-6 elementary; Belvidere, Eden, Hyde Park, Johnson, Waterville) and
    #058B (7-12 plus Green Mountain Technology & Career Center; adds
    Cambridge). The FY27 annual report (Canva-made, 50 pages, 34 MB) is a
    direct PDF on resources.finalsite.net; its AOE Three Prior Years forms
    (PDF pp. 38 and 43) are image-only pages and must be read visually. The
    server sends no Content-Disposition, so the filename is the URL's last
    path segment. Annual meeting minutes (with the March 3, 2026 Australian
    ballot results) are posted as a PDF on the same CDN.
