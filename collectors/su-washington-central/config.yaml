  notes: >-
    Replaces the stale wcsuonline.org source from the registry (did not respond when tried on
    2026-11-28). The district is Washington Central Unified Union School District (Montpelier;
    towns Berlin, Calais, East Montpelier, Middlesex, Worcester) at wcuusd.org. District links
    are finalsite resource-manager URLs that 302-redirect to resources.finalsite.net PDFs with
    no Content-Disposition (use the URL filename). The FY2027 annual report is shown as a
    Heyzine flipbook, but the uploaded source PDF is downloadable from
    cdnm.heyzine.com/files/uploaded/<hash>.pdf (found in the flipbook page HTML). Certified
    vote results are on https://www.wcuusd.org/school-board/vote-results as image-only PDFs.
    Some links on the annual reports page (2023, 2024) are broken.
