  notes: >-
    Replaces the stale owsu.org source (old SU domain; no longer resolves). The
    union serves six districts (First Branch USD, Granville-Hancock USD,
    Rochester-Stockbridge USD, White River USD, Sharon, Strafford) although the
    AOE registry lists only four. The wrvsu.org Budgets page itself renders
    empty to a fetcher; the Drive folder is reached from the home page quick
    link. Drive files download with
    https://drive.google.com/uc?export=download&id=<ID>&confirm=t and the
    server sends the filename. FY27 files are text-based PDFs; the AOE Three
    Prior Years form is stamped PRELIMINARY / ESTIMATES ONLY. No standalone
    WRVSU (SU office) FY27 budget file was found; the RSUD mailer contains a
    WRVSU FY27 budget section. Newspaper results (Valley News) are the only
    vote-result source found.
