  notes: >-
    The registry URL (site root) works but lists nothing. The district is
    Orange Southwest School District (towns Braintree, Brookfield, Randolph);
    its Finalsite site hides links from plain HTML (use web_extract or a
    browser). The page also shows an unnecessary Heyzine flipbook of the same
    report; the true PDF is the resource-manager link below it. Resource-manager
    links redirect to a finalsite PDF and send no Content-Disposition, so the
    filename is the URL's last segment. The FY27 report (2026) has broken font
    encodings (digits missing from text extraction), so read pp. 5 and 25 as
    images. Voting results PDFs are scans.
