  notes: >-
    The registry URL https://lamoillesouth.org/ redirects to https://www.lamoillesouth.org/ (200); the budget
    material is at /budgets. Budget links are logo images with no text, so identify each by downloading it
    (Drive uc?export=download&id=<ID> sends Content-Disposition with the filename). The index PDFs carry the
    real document links as PDF URI annotations (strings or pdftotext will not show them; grep the raw bytes
    for drive.google.com/file/d/<ID>). Three budget-setting entities: the SU (assessments) and its two member
    districts, Elmore-Morristown UUSD and Stowe SD. Presentations and the EMUU packet are image-only PDFs.
    No AOE Three Prior Years Comparisons form was found for FY27. FY26 index PDFs are linked on the page but
    were not downloaded.
