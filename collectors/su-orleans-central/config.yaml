  notes: >-
    The registry URL http://www.ocsu.org/ is current (redirects to https) but is
    only the home page; budgets live on the Board Annual Reports documents page.
    The union has two budget-setting member districts (Lake Region Union
    Elementary-Middle SD and Lake Region Union High School SD) plus the SU's own
    central budget funded by assessments. Files are served from
    files-backend.assets.thrillshare.com with no Content-Disposition; older
    files exist on core-docs.s3.us-east-1.amazonaws.com. The pages list FY11
    through FY27 annual reports (not all years downloaded). District reports
    carry a revenue/LTW ADM page, not the AOE Three Prior Years form. A
    unified union district (Orleans Central UUSD) was put to voters on
    2026-11-03; first unified budget would be FY28.
