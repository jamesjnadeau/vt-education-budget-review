  notes: >-
    Replaces the dead registry URL http://www.essexnorth.org/ (no response on
    2026-11-28). The current site is ensuvt.org (Apptegy/Thrillshare). Document
    links are injected by JavaScript, so a plain curl of the page shows none;
    read them with a browser. Links are aptg.co short URLs that redirect to
    signed S3 URLs; fetch with GET (HEAD returns 403) and take the filename from
    Content-Disposition (the NEK Choice file sends none; the name is the last
    path segment of the redirect target). ENSU has no separate annual report on
    the site; its budget is printed inside the Canaan School District annual
    report and the NEK Choice annual report in the town reports.
