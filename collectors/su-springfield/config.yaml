  notes: >-
    The registry URL http://www.ssdvt.org/ redirects to https://www.ssdvt.org/
    and returns 200 (an Edlio site); it is the district home page, not a budget
    page, so the two pages above replace it. Springfield School District is
    one budget-setting district (Springfield SU = Springfield Town School
    District). Documents are PDFs on 4.files.edl.io; the server sends a
    Content-Disposition filename that differs from the link text (e.g.
    "SSDFY2027BudgetBook.pdf"). The FY27 book carries the AOE Three Prior
    Years form on PDF p. 24 (text layer). The warning is a scanned image. The
    revote budget ("Budget Version 3", 15.9 MB, browser-printed workbook) is on
    the FY27 Budget Information page.
