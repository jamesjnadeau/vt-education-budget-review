  notes: >-
    The registry URL http://fnesu.net/ redirects (302/301) to https://www.fnesu.org/
    (Apptegy site), so it is not dead, but it has no budget documents on the front
    page. The SU has two budget-setting districts (Enosburgh-Richford UUSD #88 and
    Northern Mountain Valley UUSD #85) plus its own central-office budget. All
    documents are Google Drive links; the server sends a Content-Disposition
    filename. The district budget books are one-page-per-section PDFs printed from
    Google Sheets (text layer present, not AOE forms). Earlier years' budget pages
    were not examined.
