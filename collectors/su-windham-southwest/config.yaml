  notes: >-
    Replaces the stale http://www.windhamsw.k12.vt.us/ source (returns 404; old
    SU domain). The current SU site is https://www.wswsu49.org (Google Sites).
    The SU has five budget-setting districts (Halifax, Readsboro, Searsburg,
    Stamford, Twin Valley USD) plus Somerset; each posts its own annual report.
    The current-year report is embedded as a Drive viewer on the board page: the
    file id is in the iframe src (drive.google.com/file/d/<id>/preview) and the
    download URL is drive.google.com/uc?export=download&id=<id>. Several budget
    pages (Halifax pp.6-14, TVUUSD pp.22-37) are image-only PDFs. Searsburg's
    "SEARSBURG ANNUAL REPORT 2025.pdf" is an image-only FY2024 (year ended 30
    June 2024) town report, not an FY27 document.
