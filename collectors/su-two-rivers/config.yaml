  notes: >-
    Replaces the stale su.trsu.org source, which now 301s to https://su.trsu.org/
    and then redirects to a Google sign-in page. The live site is
    https://www.trsu.org (Google Sites). Two member districts set their own
    budgets: Green Mountain USD #77 (Andover, Baltimore, Cavendish, Chester) and
    Ludlow Mt. Holly UUSD #83 (Ludlow, Mt. Holly). Documents are Google Drive
    files; direct download works with
    https://drive.google.com/uc?export=download&id=<ID> and the server sends the
    filename. Drive folder contents can be listed without login at
    https://drive.google.com/embeddedfolderview?id=<FOLDER_ID>. The
    per-district annual-report subpages were not read.
