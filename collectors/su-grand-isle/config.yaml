    site); the budget page is https://www.gisu.org/page/budget. GISU is a supervisory union with three
    member school districts that each set their own budget (Alburgh, Champlain Islands UUSD, South
    Hero); the SU budget is assessed to them. Drive links download with
    https://drive.google.com/uc?export=download&id=<ID> and the server sends the filename. The SU
    budget PDFs are Google Sheets prints with a text layer. South Hero's warning is an image-only scan
    named SchoolArticles2025.pdf although it is the FY27 warning.
