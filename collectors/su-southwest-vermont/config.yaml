  notes: >-
    Replaces the stale www.svsu.org/education/district/district.php?sectionid=1
    source (old site layout; now 403 behind Cloudflare; the live site is an
    Edlio site under the same domain). The SU has five budget-setting member
    districts (Arlington, Mount Anthony UHSD #14, North Bennington Graded,
    Sandgate, SVUESD) plus the SU shared-services budget, so there is no single
    SU-level budget book; each is a separate Excel-printed PDF with a text
    layer and an estimated homestead tax rate calculation (not the AOE form).
    Earlier years (FY26 and before) were not checked on the site. Members also
    include Southwest Vermont Regional Technical School District, whose budget
    was not located.
