    Replaces the stale rssu.org source (the old Rutland South SU domain, now an unrelated personal site). The district is Mill River Unified Union School District #52 (Clarendon, Shrewsbury, Tinmouth, Wallingford), a single budget-setting district. The annual report is a Google Drive file linked from the homepage (served as 'application/octet-stream' with Content-Disposition filename '2026 Annual Report .pdf'); the AOE form (p. 25) and operating fund pages (pp. 15-26) are images with no text layer, so figures need vision or manual reading. There is no /budget or /annual-report page (404). Wallingford's site hosts a differing copy and a '-Rev' copy.
