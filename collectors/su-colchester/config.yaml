  notes: >-
    Registry URL (csdvt.org root) works, but the budget page is the useful
    source. The page shows only the current budget cycle (FY28 as of Nov 2026),
    so FY27 PDFs are no longer linked from it; they stay online at
    /district/schoolboard/budget/FY27/BudgetBook/... and were found by search.
    Older folders seen in search results: FY17, FY20, FY23 (Budget Book).
    The AOE 'Three Prior Years Comparisons' form is in 3PropertyTaxes
    ('FY27 Four Year Comparison.pdf'); it has a text layer. Servers send no
    Content-Disposition, so filenames are URL basenames. The Voting Record
    History PDF (all votes since 1994) sits in the current year's folder.
